<script>
(function(){
  "use strict";

  /* ---- scroll progress + nav --------------------------------- */
  var nav = document.getElementById('nav');
  var scrollBar = document.getElementById('scrollBar');
  function onScroll(){
    nav.classList.toggle('scrolled', window.scrollY > 40);
    var h = document.body.scrollHeight - window.innerHeight;
    scrollBar.style.width = (h > 0 ? (window.scrollY / h * 100) : 0) + '%';
  }
  onScroll();
  window.addEventListener('scroll', onScroll, {passive:true});

  /* ---- mobile menu ------------------------------------------- */
  var burger = document.getElementById('burger');
  var menu = document.getElementById('mobileMenu');
  function toggleMenu(open){
    nav.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    document.body.style.overflow = open ? 'hidden' : '';
  }
  burger.addEventListener('click', function(){
    toggleMenu(!nav.classList.contains('open'));
  });
  menu.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){ toggleMenu(false); });
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && nav.classList.contains('open')) toggleMenu(false);
  });

  /* ---- year -------------------------------------------------- */
  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---- Notion block → HTML renderer -------------------------- */
  /* ⚙ Same proxy URL as index.html */
  var NOTION_PROXY = 'https://notionproxy.veerachit.workers.dev';

  function richText(arr){
    if(!arr || !arr.length) return '';
    return arr.map(function(t){
      var s = t.plain_text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      if(t.annotations){
        if(t.annotations.bold)   s = '<strong>'+s+'</strong>';
        if(t.annotations.italic) s = '<em>'+s+'</em>';
        if(t.annotations.code)   s = '<code>'+s+'</code>';
      }
      if(t.href) s = '<a href="'+t.href+'" target="_blank" rel="noopener">'+s+'</a>';
      return s;
    }).join('');
  }

  function renderBlocks(blocks){
    var html = '';
    var inUl = false, inOl = false;
    blocks.forEach(function(b){
      /* close open lists if block type changes */
      if(b.type !== 'bulleted_list_item' && inUl){ html += '</ul>'; inUl = false; }
      if(b.type !== 'numbered_list_item' && inOl){ html += '</ol>'; inOl = false; }

      switch(b.type){
        case 'paragraph':
          var txt = richText(b.paragraph.rich_text);
          html += txt ? '<p>'+txt+'</p>' : '<p>&nbsp;</p>';
          break;
        case 'heading_1':
          html += '<h2>'+richText(b.heading_1.rich_text)+'</h2>'; break;
        case 'heading_2':
          html += '<h3>'+richText(b.heading_2.rich_text)+'</h3>'; break;
        case 'heading_3':
          html += '<h4>'+richText(b.heading_3.rich_text)+'</h4>'; break;
        case 'bulleted_list_item':
          if(!inUl){ html += '<ul>'; inUl = true; }
          html += '<li>'+richText(b.bulleted_list_item.rich_text)+'</li>'; break;
        case 'numbered_list_item':
          if(!inOl){ html += '<ol>'; inOl = true; }
          html += '<li>'+richText(b.numbered_list_item.rich_text)+'</li>'; break;
        case 'quote':
          html += '<blockquote>'+richText(b.quote.rich_text)+'</blockquote>'; break;
        case 'divider':
          html += '<hr>'; break;
        case 'image':
          var src = b.image.type === 'external' ? b.image.external.url : b.image.file.url;
          var cap = b.image.caption && b.image.caption.length
            ? richText(b.image.caption) : '';
          html += '<figure><img src="'+src+'" loading="lazy" alt="'+(cap||'')+'">'
            +(cap ? '<figcaption>'+cap+'</figcaption>' : '')+'</figure>';
          break;
      }
    });
    if(inUl) html += '</ul>';
    if(inOl) html += '</ol>';
    return html;
  }

  /* ---- static fallback content (renders without the Worker) --- */
  var STATIC_POSTS = {
    '424620ab-c1bd-81b2-8d1e-f7719ec5604c': {
      title: 'AI ช่วยพิสูจน์สมมติฐานรีมันน์ได้แล้ว นี่คือ Singularity หรือยัง',
      tag: 'AI', date: '26 พฤศจิกายน 2569', lang: 'th',
      slug: 'ai-riemann-hypothesis-singularity', published: '2026-11-26',
      excerpt: 'โจทย์อายุ 167 ปีถูกปิดลงด้วยคนหนึ่งคนกับ AI หนึ่งตัว บทเรียนสำหรับธุรกิจไม่ใช่เรื่องซูเปอร์อินเทลลิเจนซ์ แต่อยู่ที่ว่างานไหนตรวจคำตอบได้',
      description: 'AI ช่วยพิสูจน์สมมติฐานรีมันน์ได้ แปลว่า Singularity มาถึงแล้วหรือยัง วีรชิต จารุธนเดช สรุปข้อเท็จจริง ข้อโต้แย้ง และ 4 บทเรียนสำหรับผู้นำธุรกิจ',
      html: '<p class="post-lede"><strong>สรุปสั้น:</strong> วันที่ 20 พฤศจิกายน 2026 นักคณิตศาสตร์ Levent Alpöge เผยแพร่บทพิสูจน์สมมติฐานรีมันน์ ซึ่งเป็นโจทย์ที่ค้างมาตั้งแต่ปี 1859 เขาทำงานนี้ร่วมกับ Claude ของ Anthropic และบทพิสูจน์ผ่านการตรวจด้วยโปรแกรม Lean ภายในไม่กี่วัน หลายคนเรียกเหตุการณ์นี้ว่า Singularity แต่ภาพที่ตรงกว่าคือ AI ไปได้เร็วที่สุดในงานที่ตรวจคำตอบได้ด้วยเครื่อง และมีคนที่เก่งจริงคอยกำกับทิศ ผู้นำธุรกิจควรเอาบทเรียนนี้ไปใช้กับงานตัวเอง</p><p>ต้นเดือนนี้ผมเขียนไว้ใน <a href="/thoughts/what-the-singularity-means-for-thai-business/">Singularity คืออะไร และธุรกิจไทยควรเตรียมตัวอย่างไร</a> ว่าไม่มีใครรู้ว่า Singularity จะมาเมื่อไร สามสัปดาห์ต่อมา ข่าวใหญ่ที่สุดของวงการคณิตศาสตร์ในรอบหลายสิบปีทำให้คำถามนี้กลับมาดังอีกครั้ง</p><hr><h2>เกิดอะไรขึ้น</h2><p>สมมติฐานรีมันน์ (Riemann hypothesis) เป็นข้อคาดการณ์เรื่องการกระจายตัวของจำนวนเฉพาะ และเป็นหนึ่งในโจทย์รางวัลแห่งสหัสวรรษ (Millennium Prize) ของ Clay Mathematics Institute ที่มีเงินรางวัล 1 ล้านดอลลาร์ <a href="https://www.sciencenews.org/article/riemann-hypothesis-solved-math-ai" target="_blank" rel="noopener">Science News</a> เรียกมันว่าปริศนาที่โด่งดังที่สุดในคณิตศาสตร์</p><ul><li><strong>ใครทำ:</strong> Levent Alpöge นักคณิตศาสตร์ที่ทำงานอยู่ที่ Anthropic เผยแพร่บทพิสูจน์บนเว็บไซต์ของตัวเองเมื่อ 20 พฤศจิกายน</li><li><strong>ทำอย่างไร:</strong> เขาทำงานโต้ตอบกับ Claude อยู่หลายสัปดาห์ Claude ใช้คลังบทพิสูจน์ Mathlib และใช้ Lean ตรวจงานตัวเองระหว่างทาง</li><li><strong>ตรวจอย่างไร:</strong> Lean เป็นซอฟต์แวร์ที่แปลงเหตุผลทางคณิตศาสตร์เป็นโค้ด แล้วเช็กว่าทุกขั้นตอนต่อกันได้จริง ทีม Lean FRO และ Mathlib แถลงว่า “มั่นใจเต็มที่” ว่าบทพิสูจน์ถูกต้อง</li><li><strong>ขนาด:</strong> <a href="https://www.euronews.com/2026/11/23/ai-just-cracked-the-biggest-maths-problem-of-all-time-what-does-it-mean" target="_blank" rel="noopener">Euronews</a> รายงานว่าบทพิสูจน์ยาวกว่า 17 ล้านบรรทัดของโค้ด Lean และมีร่างข้อความที่ AI เขียนยาวกว่า 250,000 หน้า</li></ul><h2>ทำไมคนถึงพูดถึง Singularity</h2><p>Elon Musk โพสต์ว่าซูเปอร์อินเทลลิเจนซ์มาถึงแล้ว และ “ยินดีต้อนรับสู่ Singularity” ฝั่งนักคณิตศาสตร์ก็ตื่นเต้นไม่แพ้กัน Ken Ono จาก University of Virginia บอก Science News ว่าในฐานะหมุดหมายทางคณิตศาสตร์ ไม่มีอะไรใหญ่กว่านี้แล้ว</p><p>แต่เสียงที่ระมัดระวังก็มีน้ำหนักพอกัน</p><ul><li><strong>AI ไม่ได้ทำคนเดียว:</strong> Bryna Kra จาก Northwestern University ชี้ว่า Alpöge ไม่ได้แค่สั่งให้หาบทพิสูจน์แล้วกดปุ่มรอ เขาเป็นนักคณิตศาสตร์ฝีมือดีที่คอยกำกับทิศ แม้ช่วงท้าย Claude จะวิ่งแซงเขาไปไกล</li><li><strong>เก่งคณิตไม่ได้แปลว่าเก่งทุกเรื่อง:</strong> Gary Marcus นักวิทยาศาสตร์ด้านการรับรู้ เตือนว่ายังไม่ชัดว่าความสามารถนี้จะใช้ได้ทั่วไปอย่างที่หลายคนหวัง และไม่น่าจะข้ามไปใช้กับโจทย์ปลายเปิดในชีววิทยา ธุรกิจ หรือหุ่นยนต์ได้ตรง ๆ</li><li><strong>มนุษย์อ่านไม่ไหว:</strong> Association for Human Mathematics แถลงว่ายังไม่มีมนุษย์คนไหนรับผิดชอบหรือยืนยันเนื้อหานี้ได้เต็มที่ ร่างยาวหลายแสนหน้าแทบไม่มีใครอ่านจบ และนักคณิตศาสตร์ทั่วโลกยังพยายามแปลงมันให้อยู่ในรูปที่คนเข้าใจได้</li></ul><p>Singularity หมายถึงจุดที่ AI พัฒนาตัวเองเร็วจนมนุษย์คาดการณ์ไม่ได้ เหตุการณ์ครั้งนี้ยังไม่เข้าเกณฑ์นั้น ไม่มี AI ตัวไหนปรับปรุงตัวเอง และมีคนนำทางตลอด แต่ก็ไม่ควรมองข้าม เพราะมันบอกชัดว่างานแบบไหนที่ AI จะเปลี่ยนเร็วที่สุด</p><h2>4 บทเรียนสำหรับผู้นำธุรกิจ</h2><ol><li><strong>AI วิ่งเร็วที่สุดในงานที่ตรวจคำตอบได้</strong> คณิตศาสตร์มี Lean บอกได้ทันทีว่าถูกหรือผิด AI จึงลองผิดลองถูกได้มหาศาลโดยไม่ต้องรอคน งานธุรกิจที่มีกติกาตรวจได้ชัด เช่น กระทบยอดบัญชี เช็กสต็อก ตรวจสัญญากับเงื่อนไขมาตรฐาน หรือเขียนโค้ดที่มีชุดทดสอบ จะเปลี่ยนก่อนงานที่ต้องใช้ดุลยพินิจ</li><li><strong>คนที่เก่งจริงคือตัวคูณ ไม่ใช่ตัวที่ถูกแทน</strong> บทพิสูจน์นี้ไม่ได้มาจากคนทั่วไปที่สั่ง AI แต่มาจากผู้เชี่ยวชาญที่รู้ว่าจะพาโจทย์ไปทางไหน ในองค์กรก็เหมือนกัน ผลตอบแทนสูงสุดมาจากการให้ AI กับคนที่รู้งานลึกที่สุด</li><li><strong>การตรวจสอบจะกลายเป็นคอขวดใหม่</strong> เมื่อ AI ผลิตงานได้มากกว่าที่คนอ่านทัน คำถามจะย้ายจาก “ทำได้ไหม” เป็น “ใครรับรองได้ว่าถูก” ทุกงานที่ให้ AI ทำควรมีวิธีตรวจที่ชัดและมีคนรับผิดชอบผลลัพธ์ ก่อนจะขยายขนาด</li><li><strong>อย่าใช้ข่าวใหญ่เป็นเหตุผลให้รอ หรือให้ตื่นตูม</strong> ข่าวนี้ไม่ได้แปลว่าพรุ่งนี้ AI จะบริหารบริษัทแทนเรา และก็ไม่ได้แปลว่าเรื่องนี้ไกลตัว เพดานของงานที่ AI ช่วยได้สูงขึ้นอีกขั้น องค์กรที่ได้ประโยชน์คือองค์กรที่เตรียมข้อมูล กติกา และคนไว้ก่อนแล้ว</li></ol><h2>สิ่งที่ผู้นำควรทำ</h2><ul><li>ไล่ดูงานในองค์กร แล้วคัดงานที่มีคำตอบถูกผิดชัดเจนและตรวจได้อัตโนมัติ ให้เป็นจุดเริ่มใช้ AI Agent</li><li>จับคู่ AI กับคนเก่งที่สุดในแต่ละฝ่าย แทนการแจกเครื่องมือให้เท่ากันทุกคน</li><li>กำหนดเจ้าของผลลัพธ์ งานทุกชิ้นที่ AI ทำต้องมีคนลงชื่อรับรอง และมีวิธีตรวจที่เขียนไว้ชัด</li><li>ติดตามว่ามนุษย์อ่านบทพิสูจน์นี้แล้วได้อะไร หลายเดือนข้างหน้า วงการคณิตศาสตร์จะเป็นกรณีศึกษาจริงครั้งแรกว่าคนรับมือกับงานที่ AI ทำเกินกว่าที่มนุษย์อ่านทันได้อย่างไร</li></ul><p>Singularity อาจยังไม่มา แต่เส้นแบ่งระหว่างงานที่ AI ทำได้กับงานที่ยังต้องเป็นคนเพิ่งขยับอีกครั้ง คำถามคือองค์กรของเราขยับตามทันหรือเปล่า</p>'
    },
    '40e620ab-c1bd-81f5-a5c0-da37d6b2c78f': {
      title: 'Ask a Machine Who You Are',
      tag: 'AI', date: '4 November 2026',
      slug: 'ask-a-machine-who-you-are', published: '2026-11-04',
      excerpt: 'Long before any singularity, AI has become the first reader of your company. It can only repeat what it can read and connect.',
      description: 'Veerachit Jaruthanadech on the quieter shift ahead of any singularity: AI answers now introduce your company first, and four habits keep it legible to machines.',
      html: '<p class="post-lede"><strong>In brief:</strong> The debate about the singularity looks to the horizon. A smaller change has already arrived: customers, partners and journalists increasingly meet a company through an AI answer before they reach its website. That answer can only repeat what a machine can read and connect. Leaders should treat names, companies and proof as facts to be maintained.</p><p>The singularity has a long record of deadlines. In 1993 <a href="https://edoras.sdsu.edu/~vinge/misc/singularity.html" target="_blank" rel="noopener">Vernor Vinge</a> gave superhuman intelligence thirty years. <a href="https://uk.finance.yahoo.com/news/ai-scientist-ray-kurzweil-going-150002858.html" target="_blank" rel="noopener">Ray Kurzweil</a> still says 2045. In 2025 <a href="https://blog.samaltman.com/the-gentle-singularity" target="_blank" rel="noopener">Sam Altman</a> wrote that we are “past the event horizon”. Nobody can settle the argument from a boardroom, and few boards need to.</p><p>Meanwhile, a procurement manager in Singapore types a supplier’s name into an AI assistant before a first meeting. Three tidy sentences come back: what the company does, who runs it, whether it seems credible. The manager does not open the website. The supplier will never know the conversation took place.</p><hr><h2>The first reader has changed</h2><p>In early 2024, <a href="https://www.gartner.com/en/newsroom/press-releases/2024-02-19-gartner-predicts-search-engine-volume-will-drop-25-percent-by-2026-due-to-ai-chatbots-and-other-virtual-agents" target="_blank" rel="noopener">Gartner predicted</a> that traditional search volume would fall 25 per cent by 2026 as people moved to chatbots and other virtual agents. Analysts still argue over the size of that shift. Few argue over its direction.</p><p>A search engine hands people a list and lets them judge. An AI assistant hands them a paragraph. It builds that paragraph from pages it can read and facts it can connect, and it delivers the result in the same calm voice whether it is right or guessing.</p><p>Names suffer first. A Thai name can be romanised several ways, and a machine will not assume they belong to one person unless something tells it so. A founder with several companies can easily become several unconnected facts.</p><blockquote>An AI summary of your company is a draft you do not get to edit. You can only change what it reads.</blockquote><h2>Where the fault usually sits</h2><p>Many modern websites are assembled inside the browser. To a person, nothing looks wrong. <a href="https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics" target="_blank" rel="noopener">Google’s own guidance</a> describes a process of crawling, queueing for rendering and then indexing, and it recommends server-side rendering because “not all bots can run JavaScript”.</p><p>So a site can look finished to its owner and close to empty to the systems answering questions about it. Redesigns are a common moment for this to happen. Few executives ever see that view of their own company, because no management report puts it in front of them.</p><h2>Four habits that make a company legible</h2><ol><li><strong>One name, written the same way everywhere.</strong> Choose the full form of each company and founder name and use it on every site you control. Where a name exists in two scripts, state both once, side by side, so a machine can join them.</li><li><strong>Put it in the page, not after the page.</strong> Anything that appears only once a script has run is a risk. Titles, names, articles and dates should arrive in the first response from the server.</li><li><strong>Prefer proof to adjectives.</strong> A machine cannot verify “premium”. It can verify a date, a certificate, a founder, a press article. The same discipline applies to internal data, which is the argument of <a href="/thoughts/i-gave-my-companies-a-memory/">Give Your Company a Memory</a>.</li><li><strong>Make other sites say it back.</strong> A company’s own claims are weak evidence. Group websites, directories and press should use the same names and link to the same pages. Groups with several brands are often weakest here.</li></ol><h2>What not to do</h2><p>Do not write for machines instead of people. Repeating a name in every paragraph is easy to spot, and it reads badly to both. The name belongs where a person expects it: the title, the byline, the first introduction.</p><p>Structure also cannot invent a reputation. It only stops a real one from getting lost. The work still has to be worth quoting, which is why <a href="/thoughts/taste-is-the-last-moat/">taste</a> matters more now, not less.</p><h2>What leaders should do</h2><ul><li>Ask three AI assistants who runs your company and what it does. Write down every wrong answer, then find where each one could have come from.</li><li>Open your website with JavaScript switched off. What remains is close to what a hurried crawler sees.</li><li>Give one person ownership of the facts: names, titles, founding dates and addresses, consistent across every site and profile.</li><li>Repeat the test each quarter. Measure whether the answers are correct, not how many visits they send.</li></ul><p>A brand, the old line goes, is what people say about you when you leave the room. The singularity may or may not arrive on schedule. The room already has machines in it, and they quote.</p>'
    },
    '40e620ab-c1bd-81db-ad00-fdab3c16cba5': {
      title: 'The Company of 2040',
      tag: 'AI', date: '4 November 2026',
      slug: 'the-company-of-2040', published: '2026-11-04',
      excerpt: 'Everyone will rent the same intelligence. The company of 2040 will be defined by what it refuses to delegate.',
      description: 'Veerachit Jaruthanadech imagines the company of 2040: how cheap intelligence reshapes the firm, and why judgement, trust and taste become the scarce assets.',
      html: '<p class="post-lede"><strong>In brief:</strong> For a century, companies have been organised around the cost of coordinating human work. As capable agents push that cost down, the firm itself is due for redesign. This is a vision, not a forecast: by 2040, the scarce things in a company may be judgement, trust, taste and accountability. Leaders can start building for them now.</p><p>Imagine a morning in Bangkok in 2040. A company of forty people serves customers in thirty countries. Overnight, its agents negotiated with suppliers’ agents, answered customers in eleven languages, redrafted a contract and rerouted a shipment around a storm. Nobody was awake. At eight o’clock the chief executive reads one page. It holds three decisions the system declined to make by itself.</p><p>This company does not exist. Every piece of it already exists somewhere as a demo or a pilot.</p><p>Forecasts like this deserve suspicion. In 1930 John Maynard Keynes expected a fifteen-hour working week within a century. With four years left on that deadline, most managers are still waiting.</p><p>The direction, though, can be measured. In 2025 <a href="https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/" target="_blank" rel="noopener">METR</a> reported that the length of task AI agents could finish had been doubling roughly every seven months, while cautioning that the estimate depends on method. <a href="https://www.thestar.com.my/tech/tech-news/2025/06/25/over-40-of-agentic-ai-projects-will-be-scrapped-by-2027-gartner-says" target="_blank" rel="noopener">Gartner</a> expects at least 15 per cent of day-to-day work decisions to be made autonomously by 2028, up from zero in 2024. <a href="https://www.darioamodei.com/essay/machines-of-loving-grace" target="_blank" rel="noopener">Dario Amodei</a> writes of a coming “country of geniuses in a datacenter”. They may all be early. Being early would not change what they point to.</p><hr><h2>Coase’s question returns</h2><p>In 1937 <a href="https://en.wikipedia.org/wiki/The_Nature_of_the_Firm" target="_blank" rel="noopener">Ronald Coase</a> asked why firms exist at all. His answer was that organising work inside a company can be cheaper than the hidden costs of the market: searching, haggling and policing contracts. A firm grows until the overhead of managing it outweighs those savings.</p><p>Agents press on both sides of that sum. They can search, negotiate and monitor. They can also lower the overhead of running a large organisation. Nobody can yet say which effect wins. Small firms may do what only giants could. Giants may move like small firms. Either way, the boundary of a company starts to look like a design choice.</p><h2>Four shifts on the way to 2040</h2><ol><li><strong>From headcount to capability.</strong> <a href="/thoughts/headcount-is-no-longer-the-unit/">Size stops signalling strength</a>. The measure that matters is what a company can reliably decide and deliver.</li><li><strong>From org chart to permission map.</strong> The most important document in a company will say who and what may act, on what evidence, within which limits. <a href="https://www.deloitte.com/us/en/about/press-room/state-of-ai-report-2026.html" target="_blank" rel="noopener">Deloitte</a> finds that close to three-quarters of companies plan to deploy agentic AI within two years, while only 21 per cent of them report a mature model for governing it.</li><li><strong>From brand as message to brand as behaviour.</strong> When a customer’s agent buys from your agent, nobody reads the advert. Brand becomes what a company reliably does, in a form <a href="/thoughts/ask-a-machine-who-you-are/">a machine can check</a>: promises kept, facts stated plainly, behaviour that stays consistent.</li><li><strong>From labour as the constraint to energy and trust.</strong> The <a href="https://www.iea.org/reports/energy-and-ai/executive-summary" target="_blank" rel="noopener">IEA</a> expects data centre electricity use to more than double to around 945 TWh by 2030, slightly more than Japan’s total consumption today. Intelligence is only cheap if someone builds the power. And once anything can be generated, proof of where something came from becomes valuable.</li></ol><h2>What stays human</h2><p>Someone still has to answer for the outcome. A customer, a regulator or a court will not accept that the agent decided. Someone also has to choose what is worth doing, which is why <a href="/thoughts/taste-is-the-last-moat/">taste</a> outlasts execution. The remaining work looks less like production and more like stewardship: setting the purpose, drawing the limits, taking the blame.</p><p>The forty-person global company also raises a question no efficiency figure can answer. What happens to everyone else? Keynes saw that this was the harder problem, how people would use their freedom once the economic problem eased. Leaders who ignore it may build something efficient and unwelcome.</p><h2>What leaders should do</h2><ul><li>Draw your company without the org chart. List the decisions that matter, then who or what makes each one today, and who should make it in five years.</li><li>Write a permission map for one function: what agents may read, draft, send and change.</li><li>Turn your brand promises into things that can be checked.</li><li>Keep a 2040 scenario beside your three-year plan. Test it against the evidence once a year, and include what you owe your people.</li><li>Keep a human name against every decision that matters.</li></ul><p>The company of 2040 will not be defined by how much intelligence it rents. Everyone will rent the same intelligence. It will be defined by what it refuses to delegate.</p>'
    },
    '40e620ab-c1bd-81ed-a761-f9f72555b18c': {
      title: 'องค์กรไทยต้องปรับตัวอย่างไรในยุค AI ปี 2027: เมื่อ Branding และ AI Transformation เป็นเรื่องเดียวกัน',
      tag: 'Strategy', date: '4 พฤศจิกายน 2569', lang: 'th',
      slug: 'how-thai-corporates-must-adapt-to-ai-in-2027', published: '2026-11-04',
      excerpt: 'องค์กรไทยใช้ AI เร็วขึ้นมาก แต่ส่วนใหญ่ยังอยู่ระดับพื้นฐาน ปี 2027 จะแยกองค์กรที่ทำเป็นออกจากองค์กรที่แค่มีเครื่องมือ',
      description: 'องค์กรไทยควรปรับตัวอย่างไรในยุค AI ปี 2027 วีรชิต จารุธนเดช วิเคราะห์ข้อมูลจากทั่วโลก และเหตุผลที่ Branding กับ AI Transformation ต้องเดินไปด้วยกัน',
      html: '<p class="post-lede"><strong>สรุปสั้น:</strong> องค์กรไทยผ่านคำถามว่าจะใช้ AI หรือไม่มาแล้ว คำถามของปี 2027 คือจะทำให้มันเกิดผลอย่างไร ข้อมูลชี้ว่าปัญหาหลักไม่ได้อยู่ที่เครื่องมือ แต่อยู่ที่การออกแบบงาน การวัดผล และธรรมาภิบาล ขณะเดียวกัน AI กำลังกลายเป็นผู้พูดแทนแบรนด์ องค์กรที่แยก Branding ออกจาก AI Transformation จะเสียเปรียบ</p><p>ทั่วโลก ตัวเลขการใช้ AI ดูดีมาก <a href="https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai-2025" target="_blank" rel="noopener">McKinsey</a> พบว่า 88% ขององค์กรใช้ AI อย่างน้อยหนึ่งฟังก์ชัน แต่เกือบสองในสามยังไม่ได้ขยายไปทั้งองค์กร มีเพียง 39% ที่เห็นผลต่อ EBIT ระดับองค์กร และราว 6% ที่ AI สร้าง EBIT เกิน 5%</p><p>องค์กรไทยกำลังเดินเส้นทางเดียวกันอย่างรวดเร็ว <a href="https://www.dhawalshah.net/research/sea-ai-adoption-numbers/" target="_blank" rel="noopener">การศึกษาของ AWS และ Strand Partners</a> พบว่าธุรกิจไทย 43% ใช้ AI อย่างสม่ำเสมอ เพิ่มจาก 32% ในหนึ่งปี แต่ 74% ของกลุ่มนี้ยังอยู่ในระดับพื้นฐาน ตัวเลขจากแต่ละแหล่งวัดคนละกลุ่ม จึงเทียบกันตรง ๆ ไม่ได้ แต่ภาพที่เห็นไปในทางเดียวกัน คือใช้กันมากขึ้นเร็วกว่าที่ได้ผลจริง</p><hr><h2>คนไทยไปเร็วกว่าองค์กรไทย</h2><p><a href="https://news.microsoft.com/source/asia/2026/08/04/microsoft-unveils-2026-ai-work-trends-for-thailand/" target="_blank" rel="noopener">Work Trend Index 2026 ของ Microsoft</a> ระบุว่า 32% ของคนทำงานไทยเป็นผู้ใช้ AI ขั้นสูง สองเท่าของค่าเฉลี่ยโลกที่ 16% แต่มีทีมราวสองในสิบเท่านั้นที่บันทึกวิธีทำงานใหม่ที่ได้ผลให้เป็นมาตรฐานของทีมอย่างเป็นระบบ ตัวเลขนี้มาจากผู้ขายเทคโนโลยีเอง จึงควรอ่านอย่างระมัดระวัง แต่ทิศทางสอดคล้องกับแบบสำรวจอื่น</p><p>ความหมายคือ ความรู้เรื่อง AI ในองค์กรไทยจำนวนมากอยู่กับตัวบุคคล พนักงานเก่งขึ้น แต่องค์กรไม่ได้เก่งขึ้นตาม เมื่อคนนั้นลาออก ความสามารถก็ออกไปด้วย</p><h2>AI Transformation ไม่ใช่โครงการ IT</h2><p><a href="https://www.bcg.com/en-us/capabilities/artificial-intelligence" target="_blank" rel="noopener">BCG</a> ประเมินว่ามูลค่าจาก AI เพียง 10% มาจากตัวแอปพลิเคชัน อีก 20% มาจากข้อมูลและเทคโนโลยี ส่วน 70% มาจากการออกแบบงานใหม่ วัฒนธรรม ธรรมาภิบาล และการทำงานร่วมกันระหว่างคนกับ AI ถ้าตัวเลขนี้ใกล้เคียงความจริง <a href="https://ai.averyandco.co.th/" target="_blank" rel="noopener">AI Transformation</a> ก็เป็นงานที่ฝ่าย IT ทำแทนเจ้าของงานไม่ได้ แต่ <a href="https://www.deloitte.com/us/en/about/press-room/state-of-ai-report-2026.html" target="_blank" rel="noopener">Deloitte</a> พบจากผู้บริหาร 3,235 คนใน 24 ประเทศว่า มีเพียง 30% ที่กำลังออกแบบกระบวนการหลักใหม่รอบ AI ขณะที่ 37% ใช้ AI แค่ระดับผิวเผิน</p><p>ธรรมาภิบาลตามหลังเช่นกัน Deloitte พบว่าเกือบสามในสี่ของบริษัทวางแผนใช้ Agentic AI ภายในสองปี แต่มีเพียง 21% ของกลุ่มนี้ที่มีรูปแบบการกำกับดูแล Agent ที่พร้อม เรื่องนี้เร่งด่วนสำหรับองค์กรไทย เพราะ ETDA เปิด<a href="https://www.bakermckenzie.com/en/insight/publications/2026/07/thailand-draft-ai-act--seven-key-implications" target="_blank" rel="noopener">ร่างกฎหมาย AI</a> รับฟังความเห็นเมื่อกรกฎาคม 2026 ร่างนี้ครอบคลุมทั้งผู้พัฒนา ผู้ให้บริการ และผู้นำไปใช้ รวมถึงผู้ให้บริการจากต่างประเทศ ยังไม่ใช่กฎหมายและเนื้อหาอาจเปลี่ยน แต่ทิศทางชัดพอให้เริ่มเตรียมตัว</p><h2>Branding กำลังกลายเป็นเรื่อง AI</h2><p>ปี 2025 <a href="https://www.bain.com/insights/goodbye-clicks-hello-ai-zero-click-search-redefines-marketing/" target="_blank" rel="noopener">Bain</a> รายงานว่าผู้บริโภคราว 80% ได้คำตอบโดยไม่ต้องคลิกเข้าเว็บไซต์ในอย่างน้อย 40% ของการค้นหา และประเมินว่าทราฟฟิกจากการค้นหาลดลง 15–25% ลูกค้าจึงอาจรู้จักบริษัทจากคำตอบที่ AI เรียบเรียงให้ ก่อนจะเห็นเว็บไซต์หรือโฆษณา</p><p><a href="https://www.averyandco.co.th/" target="_blank" rel="noopener">Branding</a> จึงกว้างกว่าโลโก้และแคมเปญ มันคือความชัดเจนว่าบริษัทเป็นใคร ทำอะไร และยืนยันด้วยหลักฐานอะไร ถ้าสิ่งเหล่านี้ไม่ชัดหรือไม่ตรงกันในแต่ละที่ AI ก็จะเรียบเรียงความไม่ชัดนั้นต่อไป เรื่องนี้ขยายความไว้ใน <a href="/thoughts/ask-a-machine-who-you-are/">Ask a Machine Who You Are</a></p><p>เมื่อทุกบริษัทผลิตเนื้อหาด้วยเครื่องมือชุดเดียวกัน ทุกอย่างก็เริ่มฟังเหมือนกัน ความต่างจึงย้ายไปอยู่ที่<a href="/thoughts/taste-is-the-last-moat/">รสนิยม</a>และจุดยืนที่องค์กรตัดสินใจเอง</p><h2>สามจุดที่สองเรื่องนี้มาบรรจบกัน</h2><ul><li><strong>Agent ที่คุยกับลูกค้า</strong> ทุกคำตอบคือเสียงของแบรนด์ แต่คนที่ตั้งค่าระบบมักไม่ได้อยู่ทีมแบรนด์</li><li><strong>คำตอบของ AI เกี่ยวกับบริษัท</strong> ข้อมูลที่ AI อ่านได้กลายเป็นภาพลักษณ์ของบริษัท แต่แทบไม่มีใครเป็นเจ้าของเรื่องนี้</li><li><strong>เนื้อหาที่ AI ผลิต</strong> ปริมาณเพิ่มขึ้นหลายเท่า แต่กระบวนการตรวจแบรนด์ยังออกแบบไว้สำหรับงานจำนวนน้อย และร่างกฎหมายก็เริ่มพูดถึงการเปิดเผยการใช้ AI</li></ul><h2>ห้าเรื่องที่องค์กรไทยควรทำก่อนเข้าปี 2027</h2><ol><li><strong>ย้ายเจ้าของเรื่องจาก IT ไปที่ผู้นำธุรกิจ</strong> ให้ CEO กำหนดว่าจะใช้ AI เพื่อเป้าหมายธุรกิจข้อไหน แล้วให้เจ้าของงานเป็นผู้รับผิดชอบผลลัพธ์ โดยมี IT เป็นผู้ร่วมงาน</li><li><strong>เลือกหนึ่งหรือสอง workflow แล้วออกแบบงานใหม่</strong> วัดค่าตั้งต้นก่อนเริ่ม ทั้งเวลา ต้นทุน และคุณภาพ ถ้าไม่มีตัวเลขก่อนเริ่ม ก็จะตอบไม่ได้ว่าคุ้มหรือไม่</li><li><strong>เปลี่ยนความรู้รายคนเป็นความสามารถขององค์กร</strong> เมื่อใครพบวิธีที่ได้ผล ให้บันทึกเป็นขั้นตอน ตัวอย่าง และเกณฑ์ตรวจงาน แล้วให้เครดิตคนที่แบ่งปัน</li><li><strong>เขียนแบรนด์ให้เครื่องอ่านได้</strong> จัดทำชุดข้อเท็จจริงของบริษัททั้งไทยและอังกฤษ พร้อมคู่มือน้ำเสียงที่เป็นกติกาชัดเจน ว่าพูดอะไรได้ พูดอะไรไม่ได้ และเรื่องไหนต้องส่งต่อให้คน</li><li><strong>วางธรรมาภิบาลก่อนกฎหมายบังคับ</strong> ทำบัญชีว่าองค์กรใช้ AI ที่ไหน กับข้อมูลอะไร ใครรับผิดชอบ ตรวจให้สอดคล้องกับ PDPA และบอกลูกค้าเมื่อกำลังคุยกับ AI</li></ol><h2>สิ่งที่ผู้นำควรทำในไตรมาสนี้</h2><ul><li>ถามทีมผู้บริหารว่า AI ที่ใช้อยู่สร้างผลลัพธ์อะไรที่วัดได้ ถ้าตอบไม่ได้ ให้เริ่มจากการวัด ไม่ใช่การซื้อเพิ่ม</li><li>ให้หัวหน้าฝ่ายแบรนด์และหัวหน้าโครงการ AI นั่งประชุมเดียวกัน แล้วตกลงว่าใครอนุมัติสิ่งที่ AI พูดกับลูกค้า</li><li>ลองถาม AI หลายตัวว่าบริษัทของคุณคือใคร แล้วจดสิ่งที่ผิด</li><li>ทำบัญชีการใช้ AI ทั้งองค์กรให้เสร็จ รวมถึงเครื่องมือที่พนักงานเลือกใช้เอง</li></ul><p>ปี 2027 องค์กรไทยจะไม่ได้ต่างกันที่มี AI หรือไม่ แทบทุกองค์กรจะมี ความต่างจะอยู่ที่ว่าองค์กรพิสูจน์ผลได้หรือเปล่า และลูกค้าเชื่อสิ่งที่ AI พูดแทนบริษัทหรือไม่</p>'
    },
    '40e620ab-c1bd-8165-b554-ddd7fb1784bb': {
      title: 'Singularity คืออะไร และธุรกิจไทยควรเตรียมตัวอย่างไร',
      tag: 'AI', date: '4 พฤศจิกายน 2569', lang: 'th',
      slug: 'what-the-singularity-means-for-thai-business', published: '2026-11-04',
      excerpt: 'ไม่มีใครรู้วันที่ แต่คำถามที่ธุรกิจต้องตอบพรุ่งนี้เช้าชัดอยู่แล้ว',
      description: 'Singularity คืออะไร ใกล้แค่ไหน และธุรกิจไทยควรเตรียมอย่างไร วีรชิต จารุธนเดช สรุปมุมมองอุตสาหกรรม พร้อม 4 ขั้นเริ่มใช้ AI Agent',
      html: '<p class="post-lede"><strong>สรุปสั้น:</strong> Singularity คือจุดสมมติที่ AI พัฒนาตัวเองเร็วจนมนุษย์คาดการณ์สิ่งที่ตามมาไม่ได้ ผู้เชี่ยวชาญยังเห็นไม่ตรงกันว่าจะมาถึงเมื่อไร หรือจะมาถึงจริงไหม สำหรับธุรกิจไทย คำถามที่มีประโยชน์กว่าคือ วันนี้ AI Agent ทำงานอะไรแทนได้แล้ว และองค์กรพร้อมให้สิทธิ์มันแค่ไหน</p><p>คำว่า Singularity ถูกพูดถึงในวงการเทคโนโลยีมานานกว่าครึ่งศตวรรษ และทุกครั้งที่ AI รุ่นใหม่ออกมา มันจะกลับมาอยู่ในบทสนทนาอีก บางคนฟังแล้วตื่นเต้น บางคนฟังแล้วกังวล คนทำธุรกิจส่วนใหญ่ฟังแล้วไม่รู้ว่าต้องทำอะไรต่อ</p><hr><h2>Singularity คืออะไร</h2><p>แนวคิดนี้มีที่มาหลายช่วง ปี 1958 Stan Ulam เล่าถึงคำพูดของ John von Neumann เรื่องเทคโนโลยีที่เร่งตัวขึ้นเรื่อย ๆ ปี 1965 นักคณิตศาสตร์ I. J. Good เขียนถึงเครื่องจักรที่ฉลาดกว่ามนุษย์ว่าจะเป็น “สิ่งประดิษฐ์ชิ้นสุดท้าย” ที่มนุษย์ต้องสร้าง</p><p>ปี 1993 <a href="https://edoras.sdsu.edu/~vinge/misc/singularity.html" target="_blank" rel="noopener">Vernor Vinge</a> เขียนบทความที่ทำให้คำนี้แพร่หลาย เขาเสนอว่าภายในสามสิบปี มนุษย์จะมีวิธีสร้างปัญญาที่เหนือกว่าตัวเอง ปี 2023 ผ่านไปแล้ว และยังไม่มีฉันทามติว่าเราไปถึงจุดนั้นหรือยัง ส่วน <a href="https://uk.finance.yahoo.com/news/ai-scientist-ray-kurzweil-going-150002858.html" target="_blank" rel="noopener">Ray Kurzweil</a> ยังยืนยันตัวเลขเดิมในหนังสือปี 2024 คือ AI ระดับมนุษย์ราวปี 2029 และ Singularity ราวปี 2045</p><h2>มันใกล้แค่ไหน</h2><p>ไม่มีใครรู้ แต่ความเห็นกำลังขยับ <a href="https://arxiv.org/abs/2401.02843" target="_blank" rel="noopener">แบบสำรวจนักวิจัย AI 2,778 คน</a> ให้โอกาส 10% ภายในปี 2027 และ 50% ภายในปี 2047 ว่าเครื่องจักรจะทำงานทุกอย่างได้ดีกว่ามนุษย์โดยไม่ต้องมีคนช่วย ตัวเลข 2047 เร็วขึ้น 13 ปีจากแบบสำรวจครั้งก่อน</p><p>ปี 2025 <a href="https://blog.samaltman.com/the-gentle-singularity" target="_blank" rel="noopener">Sam Altman</a> เขียนว่าเรา “ผ่าน event horizon ไปแล้ว” ซึ่งควรอ่านโดยรู้ว่าเขานำบริษัทที่สร้าง AI อยู่</p><p>ภาพหน้างานดูต่างออกไปมาก <a href="https://www.thestar.com.my/tech/tech-news/2025/06/25/over-40-of-agentic-ai-projects-will-be-scrapped-by-2027-gartner-says" target="_blank" rel="noopener">Gartner คาดว่า</a> โครงการ Agentic AI มากกว่า 40% จะถูกยกเลิกภายในสิ้นปี 2027 เพราะต้นทุนบานปลายและมองไม่เห็นคุณค่าทางธุรกิจ และประเมินว่าในผู้ขายหลายพันราย มีราว 130 รายเท่านั้นที่เป็น Agent จริง</p><p>ทั้งสองภาพจริงได้พร้อมกัน เทคโนโลยีอาจเร็วกว่าที่คิด ขณะที่องค์กรส่วนใหญ่ยังใช้มันไม่เป็น ช่องว่างนี้แหละคือเรื่องที่ผู้นำธุรกิจจัดการได้</p><h2>สิ่งที่เปลี่ยนแล้ววันนี้: AI Agent</h2><p>แชตบอตรอให้คุณถาม AI Agent รับงานไปแล้วทำเป็นขั้นตอน มันเปิดระบบที่ได้รับอนุญาต อ่านข้อมูล แล้วรายงานหรือเสนอสิ่งที่ควรทำ ความต่างนี้เปลี่ยนคำถามของเจ้าของธุรกิจไปเลย จาก “AI ตอบอะไรได้บ้าง” เป็น “เราอยากให้มันทำอะไรแทนเรา และให้สิทธิ์แค่ไหน”</p><h2>สี่ขั้นที่ควรทำ ไม่ว่า Singularity จะมาเมื่อไร</h2><ol><li><strong>เริ่มจากคำถามเดียวที่ต้องตอบทุกวัน</strong> ร้านอาหารอาจเป็น “วันนี้สาขาไหน ของอะไรใกล้หมด” โรงงานอาจเป็น “ออเดอร์ไหนจะส่งไม่ทัน” บริษัทบริการอาจเป็น “ลูกค้ารายไหนเงียบไปนานผิดปกติ” คำตอบมักอยู่ในระบบอยู่แล้ว แต่ไม่มีใครมีเวลาเปิดดูทุกเช้า อ่านแนวคิดนี้เพิ่มได้ใน <a href="/thoughts/the-case-for-boring-ai/">The Case for Boring AI</a></li><li><strong>ล้างข้อมูลก่อนเรียกมันว่า AI</strong> ธุรกิจไทยมักเจ็บตรงนี้ หน่วยเดียวกันถูกบันทึกเป็น กรัม, g และ กก. คนละที่ ชื่อสินค้าและชื่อลูกค้าสะกดหลายแบบทั้งไทยและอังกฤษ AI Agent ไม่ได้แก้เรื่องนี้ให้ มันแค่ทำให้<a href="/thoughts/i-gave-my-companies-a-memory/">ปัญหาโผล่ขึ้นมาทุกครั้งที่ตอบ</a></li><li><strong>ส่งคำตอบเข้าช่องทางที่ทีมเปิดอยู่แล้ว</strong> <a href="https://www.lycorp.co.jp/en/story/20251205/line_thailand.html" target="_blank" rel="noopener">คนไทยราว 54 ล้านคนใช้ LINE</a> หรือราว 80% ของประชากร ระบบใหม่ที่ต้องล็อกอินอีกหนึ่งครั้งจะแพ้งานประจำวันเสมอ ข้อความถึงทีมควรบอกชัดด้วยว่ามาจากระบบ เพราะในที่ทำงานไทย ข้อความที่ดูเหมือนคำสั่งจากเจ้านายมักไม่มีใครกล้าแย้ง แม้มันจะผิด</li><li><strong>ขีดเส้นสิทธิ์ก่อนเปิดใช้</strong> กติกาที่เริ่มได้ง่ายคือ อ่านข้อมูลและร่างงานได้เอง แต่อะไรที่ออกไปหาคนอื่นหรือแก้ข้อมูลจริง ต้องมีคนอนุมัติ หรือมีกติกาที่ตรวจสอบได้คุมอยู่ ข้อมูลลูกค้าอยู่ภายใต้ PDPA ด้วย จึงต้องกำหนดตั้งแต่ต้นว่า Agent เข้าถึงอะไรได้</li></ol><h2>สิ่งที่ยังต้องเป็นคน</h2><p>AI บอกได้ว่าตัวเลขผิดปกติ แต่มันไม่รู้ว่าเมื่อวานฝนตกทั้งเมือง หรือลูกค้าประจำเพิ่งย้ายออฟฟิศ คนหน้างานเห็นบริบทนั้น</p><p>ตัวชี้วัดที่ดีจึงเป็นการตัดสินใจที่เปลี่ยนไป ไม่ใช่จำนวนข้อความที่ส่งออก ถ้าข้อความหนึ่งส่งมาสองสัปดาห์แล้วไม่มีใครทำอะไรต่างจากเดิม แปลว่ามันรายงานเรื่องที่ผิด</p><h2>สิ่งที่ผู้นำควรทำในสัปดาห์นี้</h2><ul><li>เขียนคำถามห้าข้อที่อยากให้มีคนตอบให้ทุกเช้า แล้วเลือกข้อที่คำตอบมาช้าบ่อยที่สุด</li><li>เปิดข้อมูลที่ตอบคำถามนั้นด้วยตัวเอง ถ้าคุณยังไม่เชื่อตัวเลข Agent ก็ช่วยไม่ได้</li><li>เลือกช่องทางที่ทีมเปิดอยู่แล้ว อย่าเพิ่งสร้างแอปใหม่</li><li>เขียนกติกาสิทธิ์สามบรรทัด อ่านอะไรได้ ร่างอะไรได้ อะไรต้องมีคนอนุมัติ</li><li>ให้เวลาสองสัปดาห์ แล้วดูว่ามีการตัดสินใจไหนเปลี่ยนไปบ้าง</li></ul><p>ไม่มีใครรู้วันที่ของ Singularity แต่คำถามที่องค์กรต้องตอบพรุ่งนี้เช้าชัดอยู่แล้ว เริ่มจากข้อเดียวก็พอ</p>'
    },
    '400620ab-c1bd-8103-85df-cbd9666aaa4f': {
      title: 'The Case for Boring AI',
      tag: 'AI', date: '20 October 2026',
      slug: 'the-case-for-boring-ai', published: '2026-10-20', updated: '2026-11-04',
      excerpt: 'The AI that changes a company most is often one short message a day.',
      html: '<p class="post-lede"><strong>In brief:</strong> Most companies start with the AI that makes a good demo. The returns sit somewhere duller: a daily, automatic answer to one question that matters, delivered where people already look, and quiet when there is nothing to say.</p><p>Nine o’clock is a particular hour in a restaurant. The shutters are half up, and the kitchen is deciding what it can and cannot serve at lunch.</p><p>Picture a message arriving on a manager’s phone at that hour. It lists which items are out of stock, or close to it, at each branch. Some mornings it runs to four lines. Some mornings it says nothing needs attention. Nobody would film it for a conference. It may still be worth more than anything in the boardroom demo.</p><hr><h2>The demo trap</h2><p>When executives first commission AI, they tend to ask for something that looks like intelligence: a chatbot that answers anything, a dashboard that predicts everything. These are impressive in the boardroom and fragile in the building. They ask people to change where they look, and they rarely say what to do next.</p><p>The results show. <a href="https://www.thestar.com.my/tech/tech-news/2025/06/25/over-40-of-agentic-ai-projects-will-be-scrapped-by-2027-gartner-says" target="_blank" rel="noopener">Gartner</a> expects more than 40 per cent of agentic AI projects to be cancelled by the end of 2027, citing escalating costs and unclear business value.</p><p>The information in that morning message usually exists already. It sits in the ERP, accurate and unread, because reading it requires someone to remember to open the right screen on a busy day. In most companies, every day is a busy day. So they learn about problems the old way: a customer asks for the dish and the kitchen says no.</p><blockquote>The most valuable AI does not answer new questions. It answers an old question every day, without anyone having to ask.</blockquote><hr><h2>Three properties of boring AI that works</h2><p>The systems that survive tend to share three traits.</p><ol><li><strong>It is pushed, not pulled.</strong> It arrives in the channel people already open: chat, email, the morning briefing. Anything that requires a new login competes with the job and loses.</li><li><strong>It reports exceptions, not status.</strong> A first version often lists every low item at every branch. Within a week nobody reads it. An alert that fires every day is not an alert. It is wallpaper. Most of the engineering goes into subtraction.</li><li><strong>Silence carries meaning.</strong> When the message says nothing is wrong, people have to be able to believe it. That trust is earned slowly, by being right on quiet days as well as loud ones.</li></ol><hr><h2>Where the human stays</h2><p>A good system of this kind does not begin by reordering stock, moving goods or messaging suppliers. It could. The restraint is deliberate.</p><p>A branch manager reading <em>almost out of chilli oil</em> knows what the system cannot: that a delivery lands at eleven, or that the dish is off the menu this week. The agent removes the remembering. The deciding stays with the person who can see the kitchen. That boundary will move, but it should move only after months of uneventful mornings have proved the system right.</p><hr><h2>What leaders should do</h2><ul><li>List the five questions you wish someone answered for you every morning. Pick the one whose answer most often arrives too late.</li><li>Automate that answer before you commission anything with a chat interface.</li><li>Measure it by actions taken, not by messages sent. If the message changes nothing for two weeks, it is reporting the wrong thing.</li></ul><p>Boring AI will never make a good demo. It can change how a company runs by the second week, and that is a better trade.</p>'
    },
    '400620ab-c1bd-81d9-af2e-fed1bfceeedd': {
      title: 'Where AI Systems Actually Break',
      tag: 'AI', date: '14 October 2026',
      slug: 'where-ai-systems-actually-break', published: '2026-10-14', updated: '2026-11-04',
      excerpt: 'Not in the model. In the quiet shared parts everything else is waiting on.',
      html: '<p class="post-lede"><strong>In brief:</strong> As companies wire AI into operations, failures move from the clever parts to the shared ones: a single data source, a single queue, a single login. Leaders should map what everything waits on before they add another agent.</p><p>Picture a restaurant on a Friday evening. Orders are taking more than a minute to reach the kitchen. The staff blame the internet, then the tablets, then the software.</p><p>The cause is one printer. Every ticket passes through a single queue, and the queue waits politely for a dead machine to reply before moving on. One quiet failure at one station sets the pace for the whole room. Removing it takes seconds. Finding it takes most of the evening.</p><p>That small story describes a large pattern. It is how AI systems tend to fail in practice.</p><hr><h2>Failure has moved</h2><p>The public conversation about AI risk is about the model: hallucination, bias, the wrong answer delivered with confidence. Those risks are real. In daily operations, though, they are rarely what breaks things.</p><p>What breaks things are the shared dependencies that AI quietly multiplies. When one agent reads the ERP, a unit-of-measure error in the ERP is a nuisance. When six agents read it, for costing, purchasing, reporting and stock alerts, the same error becomes six confident and consistent wrong answers. The model did its job perfectly. The ground it stood on was soft.</p><blockquote>AI does not create new single points of failure. It finds the ones you already had and puts weight on them.</blockquote><p>The load is about to rise. <a href="https://www.deloitte.com/us/en/about/press-room/state-of-ai-report-2026.html" target="_blank" rel="noopener">Deloitte</a> finds that close to three-quarters of companies plan to deploy agentic AI within two years, and only 21 per cent of them report a mature model for governing it.</p><hr><h2>A dependency audit in three questions</h2><p>Before adding an agent, ask three questions. They take an afternoon and can save weeks.</p><ol><li><strong>What does it read?</strong> Name the exact source of truth. If the answer is <em>a spreadsheet someone updates</em>, the agent inherits that person’s holidays.</li><li><strong>What else reads the same thing?</strong> Count the consumers. Every additional agent on the same source raises the cost of that source being wrong.</li><li><strong>What is the one move that takes it out of the path?</strong> For the printer, it is removing it from the configuration. For an agent, it is a kill switch someone non-technical can use at nine on a Friday night.</li></ol><hr><h2>Fix the ground, not the output</h2><p>The tempting response to a wrong AI answer is to patch the answer: a filter here, an exception there, a dashboard rule that hides the strange number. Each report then looks right, and the system as a whole becomes less true.</p><p>The better discipline is to treat every wrong answer as a pointer to the source. Suppose an agent recommends buying far more of an ingredient than any kitchen could use. The cause may not be the agent. If stock is consumed in production without its receipt ever being recorded, the system believes the company is deep in deficit. The fix belongs in the recording, not the recommendation.</p><hr><h2>What leaders should do</h2><ul><li>Ask for a one-page map of what your AI systems read, and circle anything more than two of them share.</li><li>Give every automated process an off switch and a named person allowed to use it.</li><li>When an AI answer is wrong, fund the fix at the source, even when patching the output is faster.</li></ul><p>Resilience is not a system where nothing breaks. It is one where the broken part can be lifted out of the line before the next table orders.</p>'
    },
    '400620ab-c1bd-816b-8e87-c0c710f6d6d0': {
      title: 'Label It by Hand First',
      tag: 'AI', date: '8 October 2026',
      slug: 'label-it-by-hand-first', published: '2026-10-08', updated: '2026-11-04',
      excerpt: 'Before you automate customer feedback, read it yourself. The categories you need are not obvious.',
      html: '<p class="post-lede"><strong>In brief:</strong> AI can classify unstructured feedback at scale, but only into categories someone has thought hard about. The fastest route to useful automation is a slow first pass done by hand, by someone senior enough to notice what matters.</p><p>Restaurant groups tend to read their online reviews the way one reads the weather: good week, bad week, reply politely to the angry ones, move on. An AI pipeline can now do that faster.</p><p>The better first step is slower. Take ninety days of reviews across every branch and read them one at a time, tagging each by hand: which dish, what was praised, what went wrong. It feels old-fashioned. It may be the most useful AI preparation a company can do.</p><hr><h2>The category problem</h2><p>Automate on day one, and the model will sort reviews into the categories everyone assumes matter: service, price, ambience, food. Those are the categories on every hospitality survey. They are also nearly useless for running a kitchen.</p><p>Reading by hand tends to reveal what those categories hide. Customers rarely write about the branch. They write about the dish. <em>The soup was too salty. The pork was dry. The rice at the bottom of the pot was perfect.</em> And in a group with a central kitchen, a dish is not made in one place. Its stock, sauce and marinated protein travel to every branch.</p><p>So a complaint about one dish at one branch is often a report on one batch from one kitchen. Trace dishes back through their recipes, and reviews stop being opinions. They become evidence about production.</p><blockquote>A customer who says the soup is salty is not reviewing the waiter. They are reporting on a stock made two days earlier, somewhere they will never see.</blockquote><hr><h2>Why the hand pass matters</h2><p>Machine classification is now cheap and good. The expensive part is the taxonomy: deciding what the categories should be so that each one maps to someone who can act. That is a judgment about the business, not about language, and a model cannot make it for you.</p><p>The hand pass also builds the thing every AI system needs and few companies have: a set of examples the leadership team agrees on. When the automated version later disagrees with a human, there is a reference to settle it.</p><p>The lesson travels well beyond restaurants. Support tickets, sales calls and returns data all hide the same trap.</p><hr><h2>The guardrails</h2><p>Two cautions. First, this is not a scorecard for branch teams. Blaming a branch for a batch it did not make is how you teach people to stop reporting problems. Second, reviews are a small, self-selected sample. They tell you where to look. They do not tell you what you will find.</p><hr><h2>What leaders should do</h2><ul><li>Before automating any feedback stream, have a senior person read and tag the first hundred items themselves.</li><li>Design categories around who can act on them, not around what customers talk about.</li><li>Keep the hand-tagged set as the benchmark the automated system is measured against.</li></ul><p>The model will read the next ten thousand reviews in minutes. Make sure it is looking for the right things.</p>'
    },
    '400620ab-c1bd-814d-be1f-df20ea23ffc1': {
      title: 'Why Leaders Should Go Back to Class on AI',
      tag: 'AI', date: '2 October 2026',
      slug: 'why-leaders-should-go-back-to-class-on-ai', published: '2026-10-02', updated: '2026-11-04',
      excerpt: 'Daily AI use builds deep but uneven knowledge. A structured course shows leaders where they have been guessing.',
      html: '<p class="post-lede"><strong>In brief:</strong> Executives who learned AI by using it have deep but uneven knowledge. A structured programme, such as the Google AI Professional Certificate, does less to teach the leader than to give the whole organisation a shared floor to build on.</p><p>Many executives now use AI every working day. It drafts first versions, watches the numbers and assembles reports they once waited a week for. So when one of them enrols in a structured course, colleagues reasonably ask why.</p><p>The honest answer is that experience creates confidence, and confidence is a poor guide to where one’s gaps are.</p><hr><h2>The shape of self-taught knowledge</h2><p>Most senior people learned AI by needing it. That is an excellent way to learn what works on your own problems. It is a poor way to learn what you are missing, because you only explore the corners your work happens to pass through.</p><p>The result is knowledge that is deep in places and absent in others, and the absences are invisible from the inside. That is what makes them dangerous in a leader, whose assumptions become the organisation’s defaults.</p><blockquote>Experience gives you judgment about what to do with a new tool. It does not give you the tool.</blockquote><hr><h2>What a structured programme adds</h2><p>Not secrets. Much of the material will be familiar. What it provides is structure: the same tools, laid out end to end across research, writing, analysis and building simple tools of one’s own. Three things tend to be worth the evenings.</p><ol><li><strong>A shared vocabulary.</strong> Experienced users have private words for things. A course gives them words their managers can look up, which makes every later conversation shorter.</li><li><strong>The habits people skip.</strong> Checking outputs systematically. Being deliberate about which data goes into a tool and which never should.</li><li><strong>A floor leaders can ask others to reach.</strong> Nobody can hand a team two years of trial and error. Anyone can hand them a programme.</li></ol><hr><h2>Credentials versus capability</h2><p>It would be easy to oversell a certificate. It proves a course was completed. It does not prove that anyone can change how a company runs. <a href="https://www.bcg.com/en-us/capabilities/artificial-intelligence" target="_blank" rel="noopener">BCG</a> estimates that only 10 per cent of AI transformation value comes from the application itself, and 70 per cent from workflow redesign, culture, governance and human-AI collaboration. A course touches little of that directly.</p><p>But a common foundation makes that work faster. When everyone in the room means the same thing by the same word, the discussion moves on to what actually matters: what to automate, what to leave to people, and where the line between them should sit this quarter.</p><hr><h2>What leaders should do</h2><ul><li>Take the course yourself before asking your team to. The signal matters as much as the content.</li><li>Treat it as a floor for managers, not a ceiling for specialists.</li><li>Follow it with one real project per team, so the vocabulary meets the messy data quickly.</li></ul><p>The easiest trap for a seasoned leader is believing that experience covers everything new. Being a beginner again, on purpose and in public, is a leadership skill worth keeping.</p>'
    },
    '3c6620ab-c1bd-81a5-8557-dbe68b055d7c': {
      title: 'Headcount Is No Longer the Unit',
      tag: 'Operating', date: '12 August 2026',
      slug: 'headcount-is-no-longer-the-unit', published: '2026-08-12', updated: '2026-11-04',
      excerpt: 'For decades, companies were sized by how many people they took. That number is losing its meaning.',
      html: '<p>Ask how many people work at a company and you will get a number. It is becoming a useless one.</p><p>Not wrong. Useless. It describes what the company costs. It says nothing about what the company can do.</p><hr><h2>What the number used to mean</h2><p>For decades, headcount was a reliable proxy for four things at once: capacity, revenue, seriousness and ambition. A forty-person agency could take work a six-person agency could not. Hear a team size, and you knew roughly what they could deliver and roughly what they charged.</p><p>That single number did a lot of work. It is doing less of it every year.</p><hr><h2>Where it breaks</h2><p>Consider month-end reporting at a typical multi-branch business. One person spends three days pulling sales per branch, reconciling them against the ERP, chasing the branches that have not closed their counts and rebuilding the deck. Three days, every month, forever.</p><p>Automated, it becomes a scheduled job. It runs at 3am on the first. Nobody remembers to run it, because nobody has to.</p><p>That person need not disappear. They can move to something that actually needs a person: sitting with branch managers, working out why one location’s costs drift and another’s do not. The work that got automated was never the valuable part. It was the tax paid to see the valuable part.</p><p>Multiply that across a company and headcount stops tracking anything real. <a href="https://www.thestar.com.my/tech/tech-news/2025/06/25/over-40-of-agentic-ai-projects-will-be-scrapped-by-2027-gartner-says" target="_blank" rel="noopener">Gartner</a> expects at least 15 per cent of day-to-day work decisions to be made autonomously by 2028, up from zero in 2024.</p><blockquote>Headcount measured what the work cost. It never measured the work.</blockquote><hr><h2>What to count instead</h2><p>Three things, none of them a people number.</p><ul><li><strong>Decisions per week that genuinely need a leader.</strong> If that is rising, something is wrong with the system, not with the team.</li><li><strong>Time from question to answer.</strong> How long between <em>what is our margin on this product</em> and having a number you trust. Days is a strategy tax.</li><li><strong>How much runs without being remembered.</strong> Any process that depends on someone remembering to do it is a process that will fail in a bad month.</li></ul><p>None of these look impressive on a slide. All of them predict whether a company holds up under pressure.</p><hr><h2>The common misreading</h2><p>The temptation is to read this as <em>hire fewer people</em>. That misses the point.</p><p>The people a company hires have to be different. Fewer hands, more judgment. When the mechanical work goes away, what is left is the part nobody can put in a job description: noticing that something is off, and caring enough to chase it.</p><p>That is harder to hire for than capacity. It is also the thing most worth hiring for now.</p><p>The unit was never people. It was judgment. Companies just used to need a lot of people to get a little of it.</p>'
    },
    '3c6620ab-c1bd-81c2-9a01-f9de5eb359ad': {
      title: 'Taste Is the Last Moat',
      tag: 'Strategy', date: '15 July 2026',
      slug: 'taste-is-the-last-moat', published: '2026-07-15', updated: '2026-11-04',
      excerpt: 'When everyone can generate, the only thing left to compete on is knowing what is good.',
      html: '<p>Picture a client sending an agency forty logo directions on a Tuesday afternoon, all made that morning. All forty are competent. Not one is right.</p><p>That is the whole problem, in one email.</p><hr><h2>What just became free</h2><p>Execution. Not entirely, and not perfectly, but enough that it has stopped being a differentiator.</p><p>For decades, the gap between a good idea and a finished thing was where agencies made their money. You could have the idea. You could not render it, typeset it, retouch it or build it. That gap was the business.</p><p>The gap is mostly gone. A founder with no design training can now produce forty directions before lunch, and the output is genuinely usable. There is no point being defensive about this.</p><hr><h2>What did not become free</h2><p>Knowing which of the forty is right. And knowing why.</p><p>That client does not need more options. They need someone to look at forty competent things and say: this one, because your customer is not buying dinner. They are buying being the person who found this place. Thirty-nine of these are selling dinner.</p><blockquote>Volume is free now. Judgment is not. The scarce input was never the making.</blockquote><hr><h2>Why taste is a moat and not a vibe</h2><p><em>Taste</em> is the kind of word people use to avoid explaining themselves, so it deserves a definition.</p><p>Taste is not preference. It is a compressed record of consequences. A seasoned operator knows that a certain kind of premium positioning does not survive its second year, because they have watched it fail. That is not an aesthetic opinion. It is a scar.</p><p>And it is a moat for a boring reason: it does not transfer. You cannot buy it, hire it in a quarter or extract it from a document. It comes from having shipped things and been wrong about them in public. The compounding is slow and there is no shortcut, which is exactly what makes it defensible.</p><hr><h2>What this changes about the work</h2><p>The agencies that understand this are moving away from selling execution hours. The deliverable used to be the work. It is becoming the decision, and the reasoning behind it, written down, so the client can make the next hundred decisions alone.</p><p>That means a smaller invoice per project and a longer relationship. It is a good trade.</p><p>The generating is free. The choosing is the job.</p>'
    },
    '3c6620ab-c1bd-81e7-8a39-da56c7c227e8': {
      title: 'Give Your Company a Memory',
      tag: 'AI', date: '18 June 2026',
      slug: 'i-gave-my-companies-a-memory', published: '2026-06-18', updated: '2026-11-04',
      excerpt: 'The jump is rarely a smarter model. It is the day the system stops forgetting.',
      html: '<p>Most companies still use AI the way you use a very fast stranger. Brilliant, instant, and starting from zero every single time.</p><p>Every session begins with the same fifteen minutes of context. Here is what we sell. Here is how the branches are structured. Here is why that number looks wrong but is not. Then the window closes and all of it evaporates.</p><p>The instinct is to wait for a better model. That is rarely the fix.</p><hr><h2>What actually changes things</h2><p>Connect the system to the places that hold the truth: the ERP, the operations database, the point of sale. Not a copy pasted into a prompt. The live thing.</p><p>The shift is obvious the first time someone asks about a stock discrepancy and gets an answer that refers to last month’s discrepancy, unprompted.</p><blockquote>The model was never the bottleneck. The amnesia was.</blockquote><hr><h2>The unglamorous part</h2><p>Almost none of the work is AI work.</p><p>It is finding out that <em>grams</em> and <em>g</em> and <em>กรัม</em> are three separate units in the ERP, and that this has quietly broken recipe costings. It is discovering an inventory count that sat negative for months because production consumed stock that was never recorded as received.</p><p>An agent with a memory does not fix any of that. It surfaces it, loudly and repeatedly, in every answer it gives. Which is uncomfortable, and correct.</p><p>Giving a company a memory means first admitting what the company actually remembers. Much of it is wrong.</p><hr><h2>What it is worth</h2><p>The value is not that answers get faster, though they do.</p><p>The value is that the questions get better. Without the first fifteen minutes of re-establishing context, people reach the second question, the one after the obvious one. That is where anything useful was ever going to be.</p><p>Few companies have reached this point. <a href="https://www.deloitte.com/us/en/about/press-room/state-of-ai-report-2026.html" target="_blank" rel="noopener">Deloitte</a> finds that 37 per cent of organisations use AI at a surface level, with little or no change to underlying processes, and only 30 per cent are redesigning key processes around it.</p><hr><h2>Where to start</h2><p>Do not start with the model. Start with what your business already knows, and where that knowledge is written down.</p><p>If the answer is <em>in people’s heads and four spreadsheets</em>, you do not have an AI problem yet. You have a bookkeeping problem, and a smarter model will not solve it.</p><p>Fix the memory first. The intelligence is the easy part now.</p>'
    },
    '369620ab-c1bd-81c1-8a5d-dbd8dc14aed8': {
      title: 'The Edit Is the Work',
      tag: 'Craft', date: '15 April 2026',
      slug: 'the-edit-is-the-work', published: '2026-04-15', updated: '2026-11-04',
      excerpt: 'Good work is not about what you add. It is about what survives the cut.',
      html: '<p>A young photographer’s first reel tends to hold everything: every good frame from the year. More feels like proof of work. It is proof of not being able to choose.</p><p>Editing is not a finishing step. It is the work.</p><hr><h2>The principle applies everywhere</h2><p>The brand brief that holds one claim instead of four. The pitch deck that drops the clever slide for the true one. The photograph that is one frame, not twelve.</p><p>The camera teaches it first. You shoot fifty frames to find one. The one is not the best of fifty. It is the only one that did not need the other forty-nine.</p><p>Branding teaches it again. Every time a client adds one more message, one more product, one more audience, the work gets weaker. More words, less meaning.</p><blockquote>What you leave out decides the result. Every time.</blockquote><hr><h2>Why this is hard</h2><p>Removing things feels like loss. It reads as indecision, or laziness, or lack of effort. The brief that says one thing looks less thorough than the brief that says ten.</p><p>It is not. It is harder.</p><p>To cut a line that took three hours to write, a line that is <em>good</em>, because it dilutes the one line that is <em>right</em>: that takes more confidence than adding another paragraph ever will.</p><p>Generative tools raise the stakes. When a first draft costs nothing, there is more to cut and less pressure to cut it. A brand that survives the edit is a brand that knows what it is.</p><hr><h2>The practice</h2><p>The method is simple.</p><ul><li>Write everything first. Get it out.</li><li>Read it once without touching it.</li><li>Find the one sentence you could not remove without losing the point.</li><li>Cut everything that is not in service of that sentence.</li></ul><p>This works for brand strategy. For photography. For operating decisions. For this essay.</p><p>Patience with the draft. Ruthlessness with the edit.</p>'
    },
    '369620ab-c1bd-8127-b593-f38306fbc0f1': {
      title: 'Why AI Won\'t Replace the Brief',
      tag: 'AI', date: '20 March 2026',
      slug: 'why-ai-wont-replace-the-brief', published: '2026-03-20', updated: '2026-11-04',
      excerpt: 'Every tool that changed how people work has one thing in common. It still needs a question.',
      html: '<p>One of the most useful prompts in any AI tool is four words: <em>what am I missing?</em></p><p>Not a brief. Not a specification. Not a 400-word instruction set. Four words, and the output can beat all of them.</p><hr><h2>What AI is good at</h2><p>AI is fast. It can generate, summarise, restructure and reframe in the time it takes to open a new document. It holds more context than a person can, retrieves faster, and in first-draft terms writes cleaner than many teams.</p><hr><h2>What AI cannot do</h2><p>It cannot know what the work is <em>for</em>.</p><p>That is the brief. That is still a human job, and not a small one.</p><p>The brief answers: Who is this for? What do we want them to feel? What must we never say? What would success look like in five years, not five weeks? These questions require knowing something that is not in any document: what the client actually cares about, what the market is ready to hear, what the brand can credibly claim.</p><blockquote>The danger is not that AI replaces thinking. The danger is that it makes it easy to skip thinking.</blockquote><p>It can generate output that <em>looks</em> like work, without anyone ever asking the right question. That is the failure mode to watch for.</p><hr><h2>The answer is not less AI</h2><p>The answer to AI-generated mediocrity is not retreating from AI. It is using it with a sharper brief.</p><p>Better question in. Better output out. The tool is only as good as the thinking that runs it.</p><p>This was true of photography. True of print. True of every medium before this one.</p><p>The tool changes. The brief stays.</p>'
    },
    '369620ab-c1bd-817a-853f-d89b6a247360': {
      title: 'Premium Is a Decision',
      tag: 'Strategy', date: '10 February 2026',
      slug: 'twenty-years-one-rule', published: '2026-02-10', updated: '2026-11-04',
      excerpt: 'Premium is not a price point. It is a decision, made early and defended when it is expensive.',
      html: '<p>Walk through almost any industry and you will find the same gap: between what exists and what could.</p><p>That gap is where durable companies begin. The question behind them is usually a simple one: <em>why does this have to be mediocre?</em></p><hr><h2>One question, many categories</h2><p>Branding has too many agencies producing safe, forgettable work. Print races to the bottom on price. Restaurants open with concepts that look good for six months, then disappear.</p><p>The categories look different. The opportunity is the same. Do it properly, hold the standard, charge accordingly. Find the customers who understand what that is worth.</p><hr><h2>What experience buys</h2><p>Not certainty. Experienced operators are wrong often.</p><p>What experience buys is pattern recognition: the ability to see, early, whether a business has a real reason to exist, or whether it is solving a problem no one has.</p><p>And one rule, reliable enough to repeat:</p><blockquote>Premium is not a price point. It is a decision. Made early, held consistently, defended when it is expensive to do so.</blockquote><p>The expensive moments are the ones that matter. When a client asks you to cut a corner. When a supplier offers a cheaper option. When the team is tired and <em>good enough</em> is available.</p><p>The companies that last are the ones that say no at the expensive moment.</p><hr><h2>What AI changes</h2><p>AI is compressing the timeline on everything. The gap between a good idea and a working company is narrower than it has ever been. <em>Good enough</em> is now available instantly, to everyone.</p><p>That makes the decision more valuable, not less. The rule still applies. Narrow the gap carefully.</p>'
    },
    '369620ab-c1bd-81d5-883f-fef7e0e826b0': {
      title: 'Claypot and Code',
      tag: 'F&B', date: '18 January 2026',
      slug: 'claypot-and-code', published: '2026-01-18', updated: '2026-11-04',
      excerpt: 'A claypot kitchen and an AI practice face the same question: what to preserve when everything moves fast.',
      html: '<p>A food business and an AI business seem to have nothing in common.</p><p>They are not as different as they look.</p><hr><h2>What claypot cooking teaches</h2><p>Claypot cooking is old. The technique predates most cooking equipment in use today. Low heat, long time, sealed vessel: the chemistry produces something a wok cannot.</p><p>The hard part is not nostalgia. It is taking a technique that is genuinely better for certain dishes and running it at scale, across multiple locations, without losing what makes it worth eating.</p><p>Most food businesses solve that problem by simplifying the food.</p><hr><h2>What good AI work requires</h2><p>AI is new. The rate of change makes most predictions obsolete within a year.</p><p>The hard part is not chasing every new model. It is applying AI to real business problems, in the work people already do, with enough rigour that the output is actually useful.</p><p>Most AI implementations solve that problem by simplifying the expectations.</p><hr><h2>The same problem, twice</h2><blockquote>How do you preserve what matters when you are moving fast?</blockquote><p>In the kitchen, the answer is the pot itself. Some things earn their pace. The operation is built around the constraint, not against it.</p><p>In AI, the answer is the brief. Speed without direction produces volume, not value. The practice is built around the question, not the output.</p><p>The claypot is slower than a wok. That is the point.</p><p>The best AI work is slower than it looks. That is also the point.</p><p>Old crafts and new technology keep teaching the same lesson from different angles.</p>'
    },
    '369620ab-c1bd-813f-991a-fb75a94358ba': {
      title: 'Bangkok and Hong Kong Are Not the Same City',
      tag: 'Operating', date: '5 December 2025',
      slug: 'bangkok-and-hong-kong-are-not-the-same-city', published: '2025-12-05', updated: '2026-11-04',
      excerpt: 'One city moves fast and trusts instinct. The other moves fast and demands proof. Both are right.',
      html: '<p>Hong Kong asks: where are the numbers?</p><p>Bangkok asks: where is the relationship?</p><p>Both are right. Both are fast. They are fast in different directions.</p><hr><h2>How they differ</h2><p>In broad strokes, a Hong Kong meeting has an agenda. It starts on time. The first fifteen minutes are information exchange. Trust is built through proof: a track record that can be checked, a deck that holds up to scrutiny, a structure that survives due diligence.</p><p>A Bangkok meeting has a context. The first fifteen minutes are reading the room. Trust is built through presence: showing up consistently, knowing the right people, demonstrating that you are in this for the relationship and not just the transaction.</p><p>Neither is superior. Both produce strong companies.</p><hr><h2>The common mistake</h2><p>People who work across the two cities tend to apply the wrong mode in the wrong room.</p><p>In Hong Kong, the mistake is being too warm too early: leading with relationship before establishing credibility, and watching the room go quiet. They are waiting for proof.</p><p>In Bangkok, the mistake is being too clinical too fast: leading with data before establishing trust, and watching the room go polite. They are waiting for connection.</p><p>The room goes quiet in the same way both times. That is how you know.</p><hr><h2>The skill</h2><blockquote>The skill is not choosing between them. It is reading which one the day needs.</blockquote><p>It takes a beat at the start of any meeting, in either city, to ask: <em>what mode is this?</em></p><p>With practice, the question becomes automatic. And each city makes you better at the other’s game.</p>'
    }
