<style>
/* ============================================================
   VEERACHIT.COM — post reader
   Inherits design language from index.html
   ============================================================ */

:root{
  --bg:#F2F0F7;
  --bg-2:#E9E7F2;
  --surface:#FFFFFF;
  --surface-2:#EEECF6;
  --line:rgba(22,19,32,.085);
  --line-2:rgba(22,19,32,.15);
  --text:#161320;
  --text-dim:#5A5668;
  --text-faint:#6E6A82;
  --violet:#8B5CF6;
  --violet-light:#7C3AED;
  --blue:#4F7DFF;
  --grad:linear-gradient(108deg,#A989FF 0%,#8B5CF6 38%,#4F7DFF 100%);
  --maxw:1480px;
  --pad:clamp(1.15rem,4vw,4.5rem);
  --ease:cubic-bezier(.16,1,.3,1);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Inter','IBM Plex Sans Thai',-apple-system,system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  overflow-x:hidden;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
::selection{background:var(--violet);color:#fff}
:focus-visible{outline:2px solid var(--violet-light);outline-offset:3px;border-radius:2px}

/* ---- scroll progress ---------------------------------------- */
#scrollBar{
  position:fixed;top:0;left:0;height:2px;width:0;
  background:var(--grad);z-index:400;
  transition:width .12s linear;pointer-events:none;
}

/* ---- layout -------------------------------------------------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.mono{font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}

/* ---- nav ----------------------------------------------------- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.15rem var(--pad);
  transition:background .4s var(--ease),box-shadow .4s var(--ease),padding .4s var(--ease);
}
.nav.scrolled{
  background:rgba(248,247,251,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 -1px 0 rgba(22,19,32,.1);
  padding-top:.78rem;padding-bottom:.78rem;
}
.brand{display:flex;align-items:center;gap:.55rem;font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;font-weight:700;font-size:1.16rem;letter-spacing:-.02em}
.brand-logo{display:block;height:23px;width:auto;filter:invert(0);transition:filter .35s var(--ease)}
.nav-links{display:flex;gap:.35rem;align-items:center}
.nav-links a{
  font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-size:.71rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-dim);
  padding:.55rem .85rem;border-radius:100px;
  transition:color .3s var(--ease),background .3s var(--ease);
}
.nav-links a:hover{color:var(--text)}
.nav-cta{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-size:.71rem;letter-spacing:.08em;
  text-transform:uppercase;padding:.7rem 1.15rem;border-radius:100px;
  background:var(--grad);color:#fff;font-weight:700;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 8px 30px rgba(139,92,246,.36);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(139,92,246,.5)}
.nav-right{display:flex;align-items:center;gap:1.2rem}
.burger{display:none;flex-direction:column;gap:6px;padding:.45rem}
.burger span{width:26px;height:2px;background:var(--text);border-radius:2px;transition:transform .35s var(--ease),opacity .25s}
.nav.open .burger span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.nav.open .burger span:nth-child(2){opacity:0}
.nav.open .burger span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

.mobile-menu{
  position:fixed;inset:0;z-index:190;background:var(--bg-2);
  display:flex;flex-direction:column;justify-content:center;gap:.1rem;
  padding:var(--pad);transform:translateY(-102%);
  transition:transform .6s var(--ease);
}
.nav.open + .mobile-menu{transform:translateY(0)}
@keyframes menuIn{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.nav.open + .mobile-menu a{animation:menuIn 500ms var(--ease) both}
.nav.open + .mobile-menu a:nth-child(1){animation-delay:60ms}
.nav.open + .mobile-menu a:nth-child(2){animation-delay:115ms}
.nav.open + .mobile-menu a:nth-child(3){animation-delay:170ms}
.nav.open + .mobile-menu a:nth-child(4){animation-delay:225ms}
.nav.open + .mobile-menu a:nth-child(5){animation-delay:280ms}
.nav.open + .mobile-menu a:nth-child(6){animation-delay:335ms}
.mobile-menu a{
  font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;font-weight:500;
  font-size:clamp(2rem,10vw,3.4rem);letter-spacing:-.02em;line-height:1.32;
  display:flex;align-items:baseline;gap:.9rem;
}
.mobile-menu a span{font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-size:.78rem;color:var(--violet-light)}
.mobile-menu a:hover{color:var(--violet-light)}
.mobile-foot{margin-top:2.2rem;color:var(--text-faint);font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}

/* ---- post layout --------------------------------------------- */
.post-wrap{
  max-width:720px;
  margin:0 auto;
  padding-left:var(--pad);
  padding-right:var(--pad);
  padding-top:8rem;
  padding-bottom:7rem;
}
.post-back{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-size:.68rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-faint);
  margin-bottom:2.8rem;
  transition:color .3s var(--ease);
}
.post-back:hover{color:var(--violet-light)}
.post-back svg{transition:transform .3s var(--ease)}
.post-back:hover svg{transform:translateX(-3px)}

.post-meta{
  display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;
  font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-size:.68rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-faint);
  margin-bottom:1.2rem;
}
.post-meta .p-tag-chip{
  background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:100px;padding:.3rem .75rem;color:var(--violet-light);
}
.post-title{
  font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;font-weight:500;
  font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.03em;line-height:1.08;
  margin-bottom:2.8rem;
}

/* ---- post content typography --------------------------------- */
.post-content{color:var(--text-dim)}
.post-content p{font-size:1.07rem;line-height:1.8;margin-bottom:1.5rem;max-width:65ch}
.post-content h2{
  font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;font-weight:500;
  font-size:clamp(1.5rem,3vw,2.2rem);letter-spacing:-.025em;
  color:var(--text);margin:3.2rem 0 1rem;
}
.post-content h3{
  font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;font-weight:500;
  font-size:1.25rem;letter-spacing:-.015em;
  color:var(--text);margin:2.4rem 0 .8rem;
}
.post-content h4{
  font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-size:.82rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--violet-light);margin:2rem 0 .6rem;
}
.post-content strong{color:var(--text);font-weight:500}
.post-content em{font-style:italic}
.post-content p.post-lede{color:var(--text);font-size:1.12rem;padding:1.1rem 1.3rem;border-left:2px solid var(--violet-light);background:rgba(139,92,246,.06);border-radius:0 10px 10px 0}
.post-content a{
  color:var(--violet-light);border-bottom:1px solid rgba(124,58,237,.3);
  transition:border-color .3s var(--ease);
}
.post-content a:hover{border-color:var(--violet-light)}
.post-content blockquote{
  border-left:3px solid var(--violet);padding:1rem 0 1rem 1.6rem;
  color:var(--text-dim);font-style:italic;font-size:1.08rem;
  margin:2.4rem 0;
}
.post-content ul,.post-content ol{
  margin:1.2rem 0 1.5rem 1.4rem;
}
.post-content li{font-size:1.07rem;line-height:1.75;margin-bottom:.4rem;max-width:65ch}
.post-content hr{
  border:0;border-top:1px solid var(--line-2);margin:3rem 0;
}
.post-content figure{
  margin:2.8rem 0;
}
.post-content figure img{
  width:100%;border-radius:14px;border:1px solid var(--line-2);
  display:block;
}
.post-content figcaption{
  font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-size:.64rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-faint);
  margin-top:.65rem;text-align:center;
}

/* ---- loading / error states ---------------------------------- */
.post-loading{
  padding:4rem 0;text-align:center;
  font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-size:.72rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);
}
.post-loading .spinner{
  width:32px;height:32px;border:2px solid var(--line-2);
  border-top-color:var(--violet-light);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 1.2rem;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- footer -------------------------------------------------- */
.footer{padding:4rem 0 0;border-top:1px solid var(--line);background:var(--bg-2)}
.footer-bottom{
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:.8rem;
  padding:1.7rem var(--pad);
}
.footer-bottom .mono{color:var(--text-faint);font-size:.68rem}
.footer-bottom a{color:var(--text-faint);transition:color .3s}
.footer-bottom a:hover{color:var(--text)}
.footer-wordmark{
  font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;font-weight:700;
  font-size:clamp(3.5rem,19vw,17rem);letter-spacing:-.04em;line-height:.8;
  text-align:center;white-space:nowrap;padding:1.2rem 0 .15em;
  background:linear-gradient(180deg,rgba(22,19,32,.1),rgba(139,92,246,.04));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  user-select:none;
}

/* ---- responsive ---------------------------------------------- */
@media(max-width:760px){
  .nav-links,.nav-cta{display:none}
  .burger{display:flex}
  .post-wrap{padding-top:6rem}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}

/* ---- article furniture (byline, author, related, archive) ------ */
.post-title{margin-bottom:1.15rem;text-wrap:balance}
.post-byline{
  font-size:.95rem;color:var(--text-dim);margin-bottom:2.8rem;
}
.post-byline a{color:var(--text);font-weight:500;border-bottom:1px solid var(--line-2);transition:border-color .3s var(--ease)}
.post-byline a:hover{border-color:var(--violet-light)}
.post-content p,.post-content li{text-wrap:pretty}
.post-author{
  display:flex;gap:1.15rem;align-items:flex-start;
  margin-top:3.6rem;padding:1.4rem;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);
}
.post-author img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:center top;flex-shrink:0;background:var(--surface-2)}
.post-author-name{font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;font-weight:500;font-size:1.05rem;color:var(--text);margin-bottom:.35rem}
.post-author-bio{font-size:.94rem;line-height:1.65;color:var(--text-dim)}
.post-author-bio a{color:var(--violet-light);border-bottom:1px solid rgba(124,58,237,.3)}
.post-related{margin-top:3.2rem}
.post-related h2{
  font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-weight:400;font-size:.68rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-faint);margin-bottom:.6rem;
}
.post-link{
  display:grid;grid-template-columns:5.2rem 1fr;gap:1rem;align-items:baseline;
  padding:.95rem 0;border-bottom:1px solid var(--line);transition:color .3s var(--ease);
}
.post-link:hover{color:var(--violet-light)}
.post-link-date{font-family:'Space Mono','IBM Plex Sans Thai',monospace;font-size:.68rem;letter-spacing:.08em;color:var(--text-faint)}
.post-link-title{font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;font-weight:500;font-size:1.08rem;line-height:1.35}
.post-link-excerpt{display:block;font-family:'Inter','IBM Plex Sans Thai',-apple-system,system-ui,sans-serif;font-weight:400;font-size:.93rem;line-height:1.55;color:var(--text-dim);margin-top:.25rem}
.post-all{display:inline-block;margin-top:1.2rem;font-size:.92rem;color:var(--violet-light);border-bottom:1px solid rgba(124,58,237,.3)}
.archive-lede{font-size:1.07rem;line-height:1.75;color:var(--text-dim);max-width:60ch;margin-bottom:2.4rem}
[lang="th"] .post-title,.post-title[lang="th"]{letter-spacing:-.005em;line-height:1.28;text-wrap:wrap}
[lang="th"] .post-content h2{letter-spacing:0;line-height:1.35}
[lang="th"] .post-content p,[lang="th"] .post-content li{line-height:1.9}
@media(max-width:560px){
  .post-author{flex-direction:column}
  .post-link{grid-template-columns:1fr;gap:.2rem}
}
@media(prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
</style>
