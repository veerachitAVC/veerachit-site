  function richText(arr){
    if(!arr || !arr.length) return '';
    return arr.map(function(t){
      var s = t.plain_text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      if(t.annotations){
        if(t.annotations.bold)   s = '<strong>'+s+'</strong>';
        if(t.annotations.italic) s = '<em>'+s+'</em>';
        if(t.annotations.code)   s = '<code>'+s+'</code>';
      }
      if(t.href) s = '<a href="'+t.href+'" target="_blank" rel="noopener">'+s+'</a>';
      return s;
    }).join('');
  }

  function renderBlocks(blocks){
    var html = '';
    var inUl = false, inOl = false;
    blocks.forEach(function(b){
      /* close open lists if block type changes */
      if(b.type !== 'bulleted_list_item' && inUl){ html += '</ul>'; inUl = false; }
      if(b.type !== 'numbered_list_item' && inOl){ html += '</ol>'; inOl = false; }

      switch(b.type){
        case 'paragraph':
          var txt = richText(b.paragraph.rich_text);
          html += txt ? '<p>'+txt+'</p>' : '<p>&nbsp;</p>';
          break;
        case 'heading_1':
          html += '<h2>'+richText(b.heading_1.rich_text)+'</h2>'; break;
        case 'heading_2':
          html += '<h3>'+richText(b.heading_2.rich_text)+'</h3>'; break;
        case 'heading_3':
          html += '<h4>'+richText(b.heading_3.rich_text)+'</h4>'; break;
        case 'bulleted_list_item':
          if(!inUl){ html += '<ul>'; inUl = true; }
          html += '<li>'+richText(b.bulleted_list_item.rich_text)+'</li>'; break;
        case 'numbered_list_item':
          if(!inOl){ html += '<ol>'; inOl = true; }
          html += '<li>'+richText(b.numbered_list_item.rich_text)+'</li>'; break;
        case 'quote':
          html += '<blockquote>'+richText(b.quote.rich_text)+'</blockquote>'; break;
        case 'divider':
          html += '<hr>'; break;
        case 'image':
          var src = b.image.type === 'external' ? b.image.external.url : b.image.file.url;
          var cap = b.image.caption && b.image.caption.length
            ? richText(b.image.caption) : '';
          html += '<figure><img src="'+src+'" loading="lazy" alt="'+(cap||'')+'">'
            +(cap ? '<figcaption>'+cap+'</figcaption>' : '')+'</figure>';
          break;
      }
    });
    if(inUl) html += '</ul>';
    if(inOl) html += '</ol>';
    return html;
  }

  var STATIC_POSTS = {
    '400620ab-c1bd-8103-85df-cbd9666aaa4f': {
      title: 'The Case for Boring AI',
      tag: 'AI', date: '20 October 2026',
      html: '<p class="post-lede"><strong>In brief:</strong> Most companies start with the AI that makes a good demo. The returns sit somewhere duller: a daily, automatic answer to one question that matters, delivered where people already look, and quiet when there is nothing to say.</p><p>Nine o’clock in Bangkok is a particular hour. The traffic on Sukhumvit has peaked, the restaurant shutters are half up, and the kitchens are deciding what they can and cannot serve at lunch.</p><p>At that hour a message arrives on my phone. It lists which items are out of stock, or close to it, at each Claypot King branch. Some mornings it runs to four lines. Some mornings it says nothing needs attention. It is the most consequential piece of AI in any of my five companies, and nobody would film it for a conference.</p><hr><h2>The demo trap</h2><p>When executives first commission AI, they tend to ask for something that looks like intelligence: a chatbot that answers anything, a dashboard that predicts everything. These are impressive in the boardroom and fragile in the building. They ask people to change where they look, and they rarely say what to do next.</p><p>The information in our morning message always existed. It sat in the ERP, accurate and unread, because reading it required someone to remember to open the right screen on a busy day. In a restaurant group, every day is a busy day. We learned about stock-outs the old way: a customer ordered the dish and the kitchen said no.</p><blockquote>The most valuable AI does not answer new questions. It answers an old question every day, without anyone having to ask.</blockquote><hr><h2>Three properties of boring AI that works</h2><p>Looking back at what stuck and what was quietly abandoned, the survivors share three traits.</p><ol><li><strong>It is pushed, not pulled.</strong> It arrives in the channel people already open: chat, email, the morning briefing. Anything that requires a new login competes with the job and loses.</li><li><strong>It reports exceptions, not status.</strong> Our first version listed every low item at every branch. Within a week nobody read it. An alert that fires every day is not an alert; it is wallpaper. Most of the engineering went into subtraction.</li><li><strong>Silence carries meaning.</strong> When the message says nothing is wrong, people have to be able to believe it. That trust is earned slowly, by being right on quiet days as well as loud ones.</li></ol><hr><h2>Where the human stays</h2><p>The agent does not reorder stock, move goods between branches or message suppliers. It could. We chose not to let it, yet.</p><p>A branch manager reading <em>almost out of chilli oil</em> knows what the system cannot: that a delivery lands at eleven, or that the dish is off the menu this week. The agent removes the remembering. The deciding stays with the person who can see the kitchen. That boundary will move, but it should move only after months of uneventful mornings have proved the system right.</p><hr><h2>What leaders should do</h2><ul><li>List the five questions you wish someone answered for you every morning. Pick the one whose answer most often arrives too late.</li><li>Automate that answer before you commission anything with a chat interface.</li><li>Measure it by actions taken, not by messages sent. If the message changes nothing for two weeks, it is reporting the wrong thing.</li></ul><p>Boring AI will never make a good demo. It will change how the company runs by the second week, and that is a better trade.</p>'
    },
    '400620ab-c1bd-81d9-af2e-fed1bfceeedd': {
      title: 'Where AI Systems Actually Break',
      tag: 'AI', date: '14 October 2026',
      html: '<p class="post-lede"><strong>In brief:</strong> As companies wire AI into operations, failures move from the clever parts to the shared ones: a single data source, a single queue, a single login. Leaders should map what everything waits on before they add another agent.</p><p>On a Friday evening, a branch manager called to say the system was slow. Orders were taking more than a minute to reach the kitchen. The staff blamed the internet, then the tablets, then the software.</p><p>It was one printer. Every ticket in that branch passed through a single queue, and the queue waited politely for a dead machine to reply before moving on. One quiet failure at one station set the pace for the whole restaurant. Removing it from the configuration took seconds. Finding it took most of the evening.</p><p>I have thought about that printer more than any model release this year, because it is exactly how AI systems fail in practice.</p><hr><h2>Failure has moved</h2><p>The public conversation about AI risk is about the model: hallucination, bias, the wrong answer delivered with confidence. Those risks are real. In our companies, though, they are rarely what breaks things.</p><p>What breaks things are the shared dependencies that AI quietly multiplies. When one agent reads the ERP, a unit-of-measure error in the ERP is a nuisance. When six agents read it, for costing, purchasing, reporting and stock alerts, the same error becomes six confident and consistent wrong answers. The model did its job perfectly. The ground it stood on was soft.</p><blockquote>AI does not create new single points of failure. It finds the ones you already had and puts weight on them.</blockquote><hr><h2>A dependency audit in three questions</h2><p>Before we add an agent now, we ask three questions. They take an afternoon and have saved us weeks.</p><ol><li><strong>What does it read?</strong> Name the exact source of truth. If the answer is <em>a spreadsheet someone updates</em>, the agent inherits that person’s holidays.</li><li><strong>What else reads the same thing?</strong> Count the consumers. Every additional agent on the same source raises the cost of that source being wrong.</li><li><strong>What is the one move that takes it out of the path?</strong> For the printer, it was removing it from the configuration. For an agent, it is a kill switch someone non-technical can use at nine on a Friday night.</li></ol><hr><h2>Fix the ground, not the output</h2><p>The tempting response to a wrong AI answer is to patch the answer: a filter here, an exception there, a dashboard rule that hides the strange number. We did that early on. It made each report look right and the system as a whole less true.</p><p>The better discipline is to treat every wrong answer as a pointer to the source. When an agent recommended buying far more of an ingredient than any kitchen could use, the cause was not the agent. Stock had been consumed in production without the receipt ever being recorded, so the system believed we were deep in deficit. We fixed the recording, not the recommendation.</p><hr><h2>What leaders should do</h2><ul><li>Ask for a one-page map of what your AI systems read, and circle anything more than two of them share.</li><li>Give every automated process an off switch and a named person allowed to use it.</li><li>When an AI answer is wrong, fund the fix at the source, even when patching the output is faster.</li></ul><p>Resilience is not a system where nothing breaks. It is one where the broken part can be lifted out of the line before the next table orders.</p>'
    },
    '400620ab-c1bd-816b-8e87-c0c710f6d6d0': {
      title: 'Label It by Hand First',
      tag: 'AI', date: '8 October 2026',
      html: '<p class="post-lede"><strong>In brief:</strong> AI can classify unstructured feedback at scale, but only into categories someone has thought hard about. The fastest route to useful automation is a slow first pass done by hand, by someone senior enough to notice what matters.</p><p>Restaurant groups tend to read their Google reviews the way one reads the weather: good week, bad week, reply politely to the angry ones, move on. We had a perfectly good AI pipeline ready to do that faster.</p><p>We did not use it, at first. Instead we pulled ninety days of reviews across every Claypot King branch and read them one at a time, tagging each by hand: which dish, what was praised, what went wrong. It felt old-fashioned. It turned out to be the most useful AI preparation we did all year.</p><hr><h2>The category problem</h2><p>Had we automated on day one, we would have asked the model to sort reviews into the categories we assumed mattered: service, price, ambience, food. Those are the categories on every hospitality survey. They are also nearly useless for running a kitchen.</p><p>Reading by hand showed something the assumed categories hid. Customers almost never write about the branch. They write about the dish. <em>The soup was too salty. The pork was dry. The rice at the bottom of the pot was perfect.</em> And in our business, a dish is not made in one place. Its stock, sauce and marinated protein come from a central kitchen and travel to every branch.</p><p>So a complaint about one dish at one branch is often a report on one batch from one kitchen. Once we traced dishes back through their recipes to the items the central kitchen produces, the reviews stopped being opinions and became evidence about production.</p><blockquote>A customer who says the soup is salty is not reviewing the waiter. They are reporting on a stock made two days earlier, somewhere they will never see.</blockquote><hr><h2>Why the hand pass matters</h2><p>Machine classification is now cheap and good. The expensive part is the taxonomy: deciding what the categories should be so that each one maps to someone who can act. That is a judgment about the business, not about language, and a model cannot make it for you.</p><p>The hand pass also builds the thing every AI system needs and few companies have: a set of examples the leadership team agrees on. When the automated version later disagrees with a human, there is a reference to settle it.</p><hr><h2>The guardrails</h2><p>Two cautions. First, this is not a scorecard for branch teams. Blaming a branch for a batch it did not make is how you teach people to stop reporting problems. Second, reviews are a small, self-selected sample. They tell you where to look. They do not tell you what you will find.</p><hr><h2>What leaders should do</h2><ul><li>Before automating any feedback stream, have a senior person read and tag the first hundred items themselves.</li><li>Design categories around who can act on them, not around what customers talk about.</li><li>Keep the hand-tagged set as the benchmark the automated system is measured against.</li></ul><p>The model will read the next ten thousand reviews in minutes. Make sure it is looking for the right things.</p>'
    },
    '400620ab-c1bd-814d-be1f-df20ea23ffc1': {
      title: 'Why Leaders Should Go Back to Class on AI',
      tag: 'AI', date: '2 October 2026',
      html: '<p class="post-lede"><strong>In brief:</strong> Executives who learned AI by using it have deep but uneven knowledge. A structured programme, such as the Google AI Professional Certificate, does less to teach the leader than to give the whole organisation a shared floor to build on.</p><p>For two years I have used AI every working day. It drafts first versions at Avery &amp; Co, watches stock at Claypot King and assembles reports I once waited a week for. So when I enrolled in the Google AI Professional Certificate, a few colleagues asked, reasonably, why.</p><p>The honest answer is that experience had made me confident, and confidence is a poor guide to where one’s gaps are.</p><hr><h2>The shape of self-taught knowledge</h2><p>Most senior people learned AI the way I did: by needing it. That is an excellent way to learn what works on your own problems. It is a poor way to learn what you are missing, because you only explore the corners your work happens to pass through.</p><p>The result is knowledge that is deep in places and absent in others, and the absences are invisible from the inside. That is what makes them dangerous in a leader, whose assumptions become the organisation’s defaults.</p><blockquote>Experience gives you judgment about what to do with a new tool. It does not give you the tool.</blockquote><hr><h2>What a structured programme adds</h2><p>Not secrets. Much of the material I recognised. What it provided was structure: the same tools I use daily, laid out end to end across research, writing, analysis and building simple tools of one’s own. Three things proved worth the evenings.</p><ol><li><strong>A shared vocabulary.</strong> I had private words for things. Now I have the words my managers can look up, which makes every later conversation shorter.</li><li><strong>The habits I had skipped.</strong> Checking outputs systematically. Being deliberate about which data goes into a tool and which never should.</li><li><strong>A floor I can ask others to reach.</strong> I cannot hand anyone two years of trial and error. I can hand them a programme.</li></ol><hr><h2>Credentials versus capability</h2><p>It would be easy to oversell a certificate. It proves a course was completed. It does not prove that anyone can change how a company runs. That change happens later, inside real systems with messy data and busy people, and it is usually done wrong a few times before it is done right.</p><p>But a common foundation makes that work faster. When everyone in the room means the same thing by the same word, the discussion moves on to what actually matters: what to automate, what to leave to people, and where the line between them should sit this quarter.</p><hr><h2>What leaders should do</h2><ul><li>Take the course yourself before asking your team to. The signal matters as much as the content.</li><li>Treat it as a floor for managers, not a ceiling for specialists.</li><li>Follow it with one real project per team, so the vocabulary meets the messy data quickly.</li></ul><p>Twenty years in, the easiest trap is believing that experience covers everything new. Being a beginner again, on purpose and in public, is a leadership skill worth keeping.</p>'
    },
    '3c6620ab-c1bd-81a5-8557-dbe68b055d7c': {
      title: 'Headcount Is No Longer the Unit',
      tag: 'Operating', date: '12 August 2026',
      html: '<p>Someone asked me last month how many people work at Avery AI. I gave a number. Then I spent the drive home realising the number was useless.</p><p>Not wrong. Useless. It described what the company costs. It said nothing about what the company can do.</p><hr><h2>What the number used to mean</h2><p>For most of my twenty years, headcount was a reliable proxy for four things at once: capacity, revenue, seriousness, and ambition. A forty-person agency could take work a six-person agency could not. When someone told me their team size, I knew roughly what they could deliver and roughly what they were charging.</p><p>That single number did a lot of work. It is not doing it any more.</p><hr><h2>Where it broke</h2><p>Month-end reporting at Claypot King used to take one person three days. Pull the POS numbers per branch, reconcile against the ERP, chase the branches that had not closed their counts, rebuild the deck. Three days, every month, forever.</p><p>It is now a scheduled job. It runs at 3am on the first. Nobody remembers to run it, because nobody has to.</p><p>That person did not disappear. They moved to something that actually needs a person — sitting with branch managers, working out why one location’s food cost drifts and another’s does not. The work that got automated was never the valuable part. It was the tax we paid to see the valuable part.</p><p>Multiply that across five companies and the headcount number stops tracking anything real.</p><blockquote>Headcount measured what the work cost us. It never measured the work.</blockquote><hr><h2>What I count instead</h2><p>Three things, none of them a people number.</p><ul><li><strong>Decisions per week that genuinely need me.</strong> If that is rising, something is wrong with the system, not with the team.</li><li><strong>Time from question to answer.</strong> How long between <em>what is our margin on this dish</em> and having a number I trust. It used to be days. Days is a strategy tax.</li><li><strong>How much runs without being remembered.</strong> Any process that depends on someone remembering to do it is a process that will fail in a bad month.</li></ul><p>None of these look impressive on a slide. All of them predict whether the company holds up under pressure.</p><hr><h2>The part I keep getting wrong</h2><p>The temptation is to read this as <em>hire fewer people</em>. That is not what I found.</p><p>What I found is that the people I do hire have to be different. Fewer hands, more judgment. When the mechanical work goes away, what is left is the part nobody can put in a job description — noticing that something is off, and caring enough to chase it.</p><p>That is harder to hire for than capacity. It is also the only thing worth hiring for now.</p><p>The unit was never people. It was judgment. We just used to need a lot of people to get a little of it.</p>'
    },
    '3c6620ab-c1bd-81c2-9a01-f9de5eb359ad': {
      title: 'Taste Is the Last Moat',
      tag: 'Strategy', date: '15 July 2026',
      html: '<p>A client sent me forty logo directions on a Tuesday afternoon. They had made them that morning. All forty were competent. Not one was right.</p><p>That is the whole problem, in one email.</p><hr><h2>What just became free</h2><p>Execution. Not entirely, and not perfectly — but enough that it stopped being a differentiator.</p><p>For most of my career, the gap between a good idea and a finished thing was where agencies made their money. You could have the idea; you could not render it, typeset it, retouch it, or build it. That gap was the business.</p><p>The gap is mostly gone. A founder with no design training can now produce forty directions before lunch, and the output is genuinely usable. This is not a thing to be defensive about.</p><hr><h2>What did not become free</h2><p>Knowing which of the forty is right. And knowing why.</p><p>That client did not need more options. They needed someone to look at forty competent things and say: this one — because your customer is not buying dinner, they are buying being the person who found this place. Thirty-nine of these are selling dinner.</p><blockquote>Volume is free now. Judgment is not. The scarce input was never the making.</blockquote><hr><h2>Why taste is a moat and not a vibe</h2><p>I want to be careful here, because <em>taste</em> is the kind of word people use to avoid explaining themselves.</p><p>Taste is not preference. It is a compressed record of consequences. I know a certain kind of premium positioning does not survive its second year in Bangkok, because I have watched it not survive — twice, with my own money. That is not an aesthetic opinion. It is a scar.</p><p>And it is a moat for a boring reason: it does not transfer. You cannot buy it, hire it in a quarter, or extract it from a document. It comes from having shipped things and been wrong about them in public. The compounding is slow and there is no shortcut, which is exactly what makes it defensible.</p><hr><h2>What this changes about the work</h2><p>At Avery &amp; Co we stopped selling execution hours. The deliverable used to be the work. The deliverable is now the decision — and the reasoning behind it, written down, so the client can make the next hundred decisions without us.</p><p>That is a smaller invoice per project and a longer relationship. I will take that trade.</p><p>The generating is free. The choosing is the job.</p>'
    },
    '3c6620ab-c1bd-81e7-8a39-da56c7c227e8': {
      title: 'I Gave My Companies a Memory',
      tag: 'AI', date: '18 June 2026',
      html: '<p>For about a year I used AI the way you use a very fast stranger. Brilliant, instant, and starting from zero every single time.</p><p>Every session began with the same fifteen minutes of context. Here is what we sell. Here is how the branches are structured. Here is why that number looks wrong but is not. Then the window closed and all of it evaporated.</p><p>I assumed the fix was a better model. It was not.</p><hr><h2>What actually changed</h2><p>We connected the thing to the systems that hold the truth. The ERP. The operations database. The POS. Not a copy pasted into a prompt — the live thing.</p><p>The first time I asked about a stock discrepancy and got an answer that referenced last month’s discrepancy, unprompted, I understood something had shifted.</p><blockquote>The model was never the bottleneck. The amnesia was.</blockquote><hr><h2>The unglamorous part</h2><p>Almost none of the work was AI work.</p><p>It was finding out that <em>grams</em> and <em>g</em> and <em>กรัม</em> were three separate units in our ERP, and that this had quietly broken a fifth of our recipe costings. It was discovering an inventory count that had sat negative for four months because production consumed stock that was never recorded as received.</p><p>An agent with a memory does not fix any of that. It surfaces it — loudly, repeatedly, in every answer it gives you. Which is uncomfortable, and correct.</p><p>Giving a company a memory means first admitting what the company actually remembers. Most of it is wrong.</p><hr><h2>What it is worth</h2><p>The value is not that answers got faster, though they did.</p><p>The value is that the questions got better. When you are not spending the first fifteen minutes re-establishing context, you spend them on the second question — the one after the obvious one. That is where anything useful was ever going to be.</p><hr><h2>What I would tell someone starting</h2><p>Do not start with the model. Start with what your business already knows, and where that knowledge is written down.</p><p>If the answer is <em>in people’s heads and four spreadsheets</em>, you do not have an AI problem yet. You have a bookkeeping problem, and a smarter model will not solve it.</p><p>Fix the memory first. The intelligence is the easy part now.</p>'
    },
    '369620ab-c1bd-81c1-8a5d-dbd8dc14aed8': {
      title: 'The Edit Is the Work',
      tag: 'Craft', date: '15 April 2026',
      html: '<p>The reel I made in 2009 had everything in it. Every good frame from that year — all 847 of them. I thought more was proof of work. It wasn\'t. It was proof I couldn\'t choose.</p><p>Editing is not a finishing step. It is the work.</p><hr><h2>The principle applies everywhere</h2><p>The brand brief that holds one claim instead of four. The pitch deck that drops the clever slide for the true one. The photograph that is one frame, not twelve.</p><p>I learned this first through a camera. You shoot fifty frames to find one. The one is not the best of fifty. It is the only one that did not need the other forty-nine.</p><p>I learned it again through branding. Every time a client asks to add one more message, one more product, one more audience — the work gets weaker. Not stronger. Weaker. More words, less meaning.</p><blockquote>What you leave out decides the result. Every time.</blockquote><hr><h2>Why this is hard</h2><p>Removing things feels like loss. It reads as indecision, or laziness, or lack of effort. The brief that says one thing looks less thorough than the brief that says ten.</p><p>It is not. It is harder.</p><p>To cut a line you spent three hours writing — a line that is <em>good</em> — because it dilutes the one line that is <em>right</em>: that takes more confidence than adding another paragraph ever will.</p><p>At Avery &amp; Co, we call the edit the last 30%. It is also the most important 30%. A brand that survives the cut is a brand that knows what it is.</p><hr><h2>The practice</h2><p>Here is how I run it now.</p><ul><li>Write everything first. Get it out.</li><li>Read it once without touching it.</li><li>Find the one sentence you could not remove without losing the point.</li><li>Cut everything that is not in service of that sentence.</li></ul><p>This works for brand strategy. For photography. For operating decisions. For this post.</p><p>Patience with the draft. Ruthlessness with the edit.</p>'
    },
    '369620ab-c1bd-8127-b593-f38306fbc0f1': {
      title: 'Why AI Won\'t Replace the Brief',
      tag: 'AI', date: '20 March 2026',
      html: '<p>The best prompt I wrote this year was four words: <em>what am I missing?</em></p><p>Not a brief. Not a specification. Not a 400-word instruction set. Four words — and the output was the most useful thing I got from any AI tool all quarter.</p><hr><h2>What AI is good at</h2><p>AI is fast. It can generate, summarise, restructure, and reframe in the time it takes me to open a new document. It holds more context than I can, retrieves faster than I can, and — in first-draft terms — writes cleaner than most teams I\'ve worked with.</p><p>I use it every day. At Avery AI we build with it, not around it.</p><hr><h2>What AI cannot do</h2><p>It cannot know what the work is <em>for</em>.</p><p>That is the brief. That is still a human job — and not a small one.</p><p>The brief answers: Who is this for? What do we want them to feel? What must we never say? What would success look like in five years, not five weeks? These are not questions AI can answer. They are questions that require knowing something that is not in any document: what the client actually cares about, what the market is ready to hear, what the brand can credibly claim.</p><blockquote>The danger is not that AI replaces thinking. The danger is that it makes it easy to skip thinking.</blockquote><p>Generate output that <em>looks</em> like work, without ever asking the right question. That is the failure mode I watch for.</p><hr><h2>The answer is not less AI</h2><p>Avery AI exists because of this tension, not despite it. The answer to AI-generated mediocrity is not retreating from AI. It is using it with a sharper brief.</p><p>Better question in. Better output out. The tool is only as good as the thinking that runs it.</p><p>This was true of photography. True of print. True of every medium I\'ve worked in.</p><p>The tool changes. The brief stays.</p>'
    },
    '369620ab-c1bd-817a-853f-d89b6a247360': {
      title: 'Twenty Years, One Rule',
      tag: 'Strategy', date: '10 February 2026',
      html: '<p>In 2006 I started a branding company in Bangkok. I was twenty years old and I didn\'t know much about running a company. I knew what good looked like — and I knew most work wasn\'t it.</p><p>That gap — between what exists and what could — has been the engine behind everything since.</p><hr><h2>Five companies, one question</h2><p>Avery &amp; Co. Avery AI. Avery Global. Papery. Claypot King. Five different fields. Branding, AI transformation, sourcing, print, food and beverage.</p><p>They look different. They are not. Each one started from the same place: <em>why does this have to be mediocre?</em></p><p>The branding category had too many agencies producing safe, forgettable work. The print industry was racing to the bottom on price. The F&amp;B space in Bangkok was full of concepts that looked good for six months, then disappeared.</p><p>In every case, the bet was the same. Do it properly, hold the standard, charge accordingly. Find the customers who understand what that\'s worth.</p><hr><h2>What twenty years bought</h2><p>Not certainty. I am wrong often, and more often than I used to admit.</p><p>What it bought is pattern recognition. The ability to see, early, whether a business has a real reason to exist — or whether it is solving a problem no one has.</p><p>And one rule, repeated enough times to be reliable:</p><blockquote>Premium is not a price point. It is a decision. Made early, held consistently, defended when it is expensive to do so.</blockquote><p>The expensive moments are the ones that matter. When a client asks you to cut a corner. When a supplier offers a cheaper option. When the team is tired and <em>good enough</em> is available.</p><p>The companies that last are the ones that said no at the expensive moment.</p><hr><h2>The next twenty years</h2><p>I have no intention of slowing down.</p><p>Bangkok and Hong Kong are both accelerating. AI is compressing the timeline on everything. The gap between a good idea and a working company is narrower than it has ever been.</p><p>The rule still applies. Narrow the gap carefully.</p>'
    },
    '369620ab-c1bd-81d5-883f-fef7e0e826b0': {
      title: 'Claypot and Code',
      tag: 'F&B', date: '18 January 2026',
      html: '<p>People find it strange that I run a food brand and an AI company at the same time.</p><p>They are not as different as they look.</p><hr><h2>What Claypot King is really about</h2><p>Claypot cooking is old. The technique predates most cooking equipment in use today. Low heat, long time, sealed vessel — the chemistry produces something a wok cannot.</p><p>Claypot King is not about nostalgia. It is about taking a technique that is genuinely better for certain dishes and running it at scale, across multiple locations, without losing what makes it worth eating in the first place.</p><p>That is a hard problem. Most food businesses solve it by simplifying the food. We chose not to.</p><hr><h2>What Avery AI is really about</h2><p>AI is new. The rate of change in the space makes most predictions obsolete within a year.</p><p>Avery AI is not about chasing every new model or capability. It is about applying AI to real business problems — in branding, in operations, in the work clients already do — with enough rigour that the output is actually useful.</p><p>That is also a hard problem. Most AI implementations solve it by simplifying the expectations. We chose not to.</p><hr><h2>The same problem, twice</h2><blockquote>How do you preserve what matters when you are moving fast?</blockquote><p>Claypot King: the answer is the pot itself. Some things earn their pace. We built the operation around the constraint, not against it.</p><p>Avery AI: the answer is the brief. Speed without direction produces volume, not value. We built the practice around the question, not the output.</p><p>The claypot is slower than a wok. That is the point.</p><p>The best AI work is slower than it looks. That is also the point.</p><p>I didn\'t plan to build a food company and an AI company in the same decade. But I\'m glad I did. They keep teaching me the same lesson from different angles.</p>'
    },
    '369620ab-c1bd-813f-991a-fb75a94358ba': {
      title: 'Bangkok and Hong Kong Are Not the Same City',
      tag: 'Operating', date: '5 December 2025',
      html: '<p>Hong Kong asks: where are the numbers?</p><p>Bangkok asks: where is the relationship?</p><p>Both are right. Both are fast. They are fast in different directions.</p><hr><h2>How they differ</h2><p>In Hong Kong, a meeting has an agenda. It starts on time. The first fifteen minutes are information exchange. Trust is built through proof — through a track record that can be checked, a deck that holds up to scrutiny, a structure that survives due diligence.</p><p>In Bangkok, a meeting has a context. The first fifteen minutes are reading the room. Trust is built through presence — through showing up consistently, through knowing the right people, through demonstrating that you are in this for the relationship, not just the transaction.</p><p>Neither is superior. Both have produced things I am proud of. Both have produced mistakes I learned from slowly.</p><hr><h2>The mistake I keep making</h2><p>I\'ve applied the wrong mode in the wrong city more times than I\'d like to admit.</p><p>In Hong Kong, I\'ve been too warm too early — led with relationship before establishing credibility, and watched the room go quiet. They were waiting for proof I hadn\'t provided yet.</p><p>In Bangkok, I\'ve been too clinical too fast — led with data before establishing trust, and watched the room go polite. They were waiting for connection I hadn\'t offered yet.</p><p>The room goes quiet in the same way both times. That is how you know.</p><hr><h2>The skill</h2><blockquote>The skill is not choosing between them. It is reading which one the day needs.</blockquote><p>This takes time. It still takes me a beat — a moment at the start of any meeting, in either city, to ask: <em>what mode is this?</em></p><p>But the question is now automatic. That is probably what twenty years of building in two cities is worth.</p><p>I spend roughly half my time in each city. Bangkok is home. Hong Kong is where a lot of the business happens. I am not sure I could do one without the other — each city has made me better at the other\'s game.</p>'
    }

        +'</div>'
        +'<h1 class="post-title">'+title+'</h1>'
        +'<div class="post-content">'
          +(blocks.results ? renderBlocks(blocks.results) : '')
        +'</div>';
    })
    .catch(function(){
      /* Worker not set up yet — fall back to static content */
      if(!renderStatic(pageId)){
        container.innerHTML = '<p style="color:var(--text-faint);font-family:\'Space Mono\',monospace;font-size:.8rem">Couldn\'t load post. <a href="index.html#thoughts" style="color:var(--violet-light)">Back to thoughts →</a></p>';
      }
    });
  }
})();
</script>

</body>
</html>
