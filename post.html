<script>
(function(){
  "use strict";

  /* ---- scroll progress + nav --------------------------------- */
  var nav = document.getElementById('nav');
  var scrollBar = document.getElementById('scrollBar');
  function onScroll(){

    var h = document.body.scrollHeight - window.innerHeight;
    scrollBar.style.width = (h > 0 ? (window.scrollY / h * 100) : 0) + '%';
  }
  onScroll();
  window.addEventListener('scroll', onScroll, {passive:true});

  /* ---- mobile menu ------------------------------------------- */
  var burger = document.getElementById('burger');
  var menu = document.getElementById('mobileMenu');
  function toggleMenu(open){
    nav.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    document.body.style.overflow = open ? 'hidden' : '';
  }
  burger.addEventListener('click', function(){
    toggleMenu(!nav.classList.contains('open'));
  });
  menu.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){ toggleMenu(false); });
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && nav.classList.contains('open')) toggleMenu(false);
  });

  /* ---- year -------------------------------------------------- */
  document.getElementById('year').textContent = new Date().getFullYear();

  /* ---- Notion block → HTML renderer -------------------------- */
  /* ⚙ Same proxy URL as index.html */
  var NOTION_PROXY = 'https://notion-proxy.veerachit.workers.dev';

  function richText(arr){
    if(!arr || !arr.length) return '';
    return arr.map(function(t){
      var s = t.plain_text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      if(t.annotations){
        if(t.annotations.bold)   s = '<strong>'+s+'</strong>';
        if(t.annotations.italic) s = '<em>'+s+'</em>';
        if(t.annotations.code)   s = '<code>'+s+'</code>';
      }
      if(t.href) s = '<a href="'+t.href+'" target="_blank" rel="noopener">'+s+'</a>';
      return s;
    }).join('');
  }

  function renderBlocks(blocks){
    var html = '';
    var inUl = false, inOl = false;
    blocks.forEach(function(b){
      /* close open lists if block type changes */
      if(b.type !== 'bulleted_list_item' && inUl){ html += '</ul>'; inUl = false; }
      if(b.type !== 'numbered_list_item' && inOl){ html += '</ol>'; inOl = false; }

      switch(b.type){
        case 'paragraph':
          var txt = richText(b.paragraph.rich_text);
          html += txt ? '<p>'+txt+'</p>' : '<p>&nbsp;</p>';
          break;
        case 'heading_1':
          html += '<h2>'+richText(b.heading_1.rich_text)+'</h2>'; break;
        case 'heading_2':
          html += '<h3>'+richText(b.heading_2.rich_text)+'</h3>'; break;
        case 'heading_3':
          html += '<h4>'+richText(b.heading_3.rich_text)+'</h4>'; break;
        case 'bulleted_list_item':
          if(!inUl){ html += '<ul>'; inUl = true; }
          html += '<li>'+richText(b.bulleted_list_item.rich_text)+'</li>'; break;
        case 'numbered_list_item':
          if(!inOl){ html += '<ol>'; inOl = true; }
          html += '<li>'+richText(b.numbered_list_item.rich_text)+'</li>'; break;
        case 'quote':
          html += '<blockquote>'+richText(b.quote.rich_text)+'</blockquote>'; break;
        case 'divider':
          html += '<hr>'; break;
        case 'image':
          var src = b.image.type === 'external' ? b.image.external.url : b.image.file.url;
          var cap = b.image.caption && b.image.caption.length
            ? richText(b.image.caption) : '';
          html += '<figure><img src="'+src+'" loading="lazy" alt="'+(cap||'')+'">'
            +(cap ? '<figcaption>'+cap+'</figcaption>' : '')+'</figure>';
          break;
      }
    });
    if(inUl) html += '</ul>';
    if(inOl) html += '</ol>';
    return html;
  }

  /* ---- static fallback content (renders without the Worker) --- */
  var STATIC_POSTS = {
    '369620ab-c1bd-81c1-8a5d-dbd8dc14aed8': {
      title: 'The Edit Is the Work',
      tag: 'Craft', date: '15 April 2026',
      html: '<p>The reel I made in 2009 had everything in it. Every good frame from that year — all 847 of them. I thought more was proof of work. It wasn\'t. It was proof I couldn\'t choose.</p><p>Editing is not a finishing step. It is the work.</p><hr><h2>The principle applies everywhere</h2><p>The brand brief that holds one claim instead of four. The pitch deck that drops the clever slide for the true one. The photograph that is one frame, not twelve.</p><p>I learned this first through a camera. You shoot fifty frames to find one. The one is not the best of fifty. It is the only one that did not need the other forty-nine.</p><p>I learned it again through branding. Every time a client asks to add one more message, one more product, one more audience — the work gets weaker. Not stronger. Weaker. More words, less meaning.</p><blockquote>What you leave out decides the result. Every time.</blockquote><hr><h2>Why this is hard</h2><p>Removing things feels like loss. It reads as indecision, or laziness, or lack of effort. The brief that says one thing looks less thorough than the brief that says ten.</p><p>It is not. It is harder.</p><p>To cut a line you spent three hours writing — a line that is <em>good</em> — because it dilutes the one line that is <em>right</em>: that takes more confidence than adding another paragraph ever will.</p><p>At Avery &amp; Co, we call the edit the last 30%. It is also the most important 30%. A brand that survives the cut is a brand that knows what it is.</p><hr><h2>The practice</h2><p>Here is how I run it now.</p><ul><li>Write everything first. Get it out.</li><li>Read it once without touching it.</li><li>Find the one sentence you could not remove without losing the point.</li><li>Cut everything that is not in service of that sentence.</li></ul><p>This works for brand strategy. For photography. For operating decisions. For this post.</p><p>Patience with the draft. Ruthlessness with the edit.</p>'
    },
    '369620ab-c1bd-8127-b593-f38306fbc0f1': {
      title: 'Why AI Won\'t Replace the Brief',
      tag: 'AI', date: '20 March 2026',
      html: '<p>The best prompt I wrote this year was four words: <em>what am I missing?</em></p><p>Not a brief. Not a specification. Not a 400-word instruction set. Four words — and the output was the most useful thing I got from any AI tool all quarter.</p><hr><h2>What AI is good at</h2><p>AI is fast. It can generate, summarise, restructure, and reframe in the time it takes me to open a new document. It holds more context than I can, retrieves faster than I can, and — in first-draft terms — writes cleaner than most teams I\'ve worked with.</p><p>I use it every day. At Avery AI we build with it, not around it.</p><hr><h2>What AI cannot do</h2><p>It cannot know what the work is <em>for</em>.</p><p>That is the brief. That is still a human job — and not a small one.</p><p>The brief answers: Who is this for? What do we want them to feel? What must we never say? What would success look like in five years, not five weeks? These are not questions AI can answer. They are questions that require knowing something that is not in any document: what the client actually cares about, what the market is ready to hear, what the brand can credibly claim.</p><blockquote>The danger is not that AI replaces thinking. The danger is that it makes it easy to skip thinking.</blockquote><p>Generate output that <em>looks</em> like work, without ever asking the right question. That is the failure mode I watch for.</p><hr><h2>The answer is not less AI</h2><p>Avery AI exists because of this tension, not despite it. The answer to AI-generated mediocrity is not retreating from AI. It is using it with a sharper brief.</p><p>Better question in. Better output out. The tool is only as good as the thinking that runs it.</p><p>This was true of photography. True of print. True of every medium I\'ve worked in.</p><p>The tool changes. The brief stays.</p>'
    },
    '369620ab-c1bd-817a-853f-d89b6a247360': {
      title: 'Twenty Years, One Rule',
      tag: 'Strategy', date: '10 February 2026',
      html: '<p>In 2006 I started a branding company in Bangkok. I was twenty years old and I didn\'t know much about running a company. I knew what good looked like — and I knew most work wasn\'t it.</p><p>That gap — between what exists and what could — has been the engine behind everything since.</p><hr><h2>Five companies, one question</h2><p>Avery &amp; Co. Avery AI. Avery Global. Papery. Claypot King. Five different fields. Branding, AI transformation, sourcing, print, food and beverage.</p><p>They look different. They are not. Each one started from the same place: <em>why does this have to be mediocre?</em></p><p>The branding category had too many agencies producing safe, forgettable work. The print industry was racing to the bottom on price. The F&amp;B space in Bangkok was full of concepts that looked good for six months, then disappeared.</p><p>In every case, the bet was the same. Do it properly, hold the standard, charge accordingly. Find the customers who understand what that\'s worth.</p><hr><h2>What twenty years bought</h2><p>Not certainty. I am wrong often, and more often than I used to admit.</p><p>What it bought is pattern recognition. The ability to see, early, whether a business has a real reason to exist — or whether it is solving a problem no one has.</p><p>And one rule, repeated enough times to be reliable:</p><blockquote>Premium is not a price point. It is a decision. Made early, held consistently, defended when it is expensive to do so.</blockquote><p>The expensive moments are the ones that matter. When a client asks you to cut a corner. When a supplier offers a cheaper option. When the team is tired and <em>good enough</em> is available.</p><p>The companies that last are the ones that said no at the expensive moment.</p><hr><h2>The next twenty years</h2><p>I have no intention of slowing down.</p><p>Bangkok and Hong Kong are both accelerating. AI is compressing the timeline on everything. The gap between a good idea and a working company is narrower than it has ever been.</p><p>The rule still applies. Narrow the gap carefully.</p>'
    },
    '369620ab-c1bd-81d5-883f-fef7e0e826b0': {
      title: 'Claypot and Code',
      tag: 'F&B', date: '18 January 2026',
      html: '<p>People find it strange that I run a food brand and an AI company at the same time.</p><p>They are not as different as they look.</p><hr><h2>What Claypot King is really about</h2><p>Claypot cooking is old. The technique predates most cooking equipment in use today. Low heat, long time, sealed vessel — the chemistry produces something a wok cannot.</p><p>Claypot King is not about nostalgia. It is about taking a technique that is genuinely better for certain dishes and running it at scale, across multiple locations, without losing what makes it worth eating in the first place.</p><p>That is a hard problem. Most food businesses solve it by simplifying the food. We chose not to.</p><hr><h2>What Avery AI is really about</h2><p>AI is new. The rate of change in the space makes most predictions obsolete within a year.</p><p>Avery AI is not about chasing every new model or capability. It is about applying AI to real business problems — in branding, in operations, in the work clients already do — with enough rigour that the output is actually useful.</p><p>That is also a hard problem. Most AI implementations solve it by simplifying the expectations. We chose not to.</p><hr><h2>The same problem, twice</h2><blockquote>How do you preserve what matters when you are moving fast?</blockquote><p>Claypot King: the answer is the pot itself. Some things earn their pace. We built the operation around the constraint, not against it.</p><p>Avery AI: the answer is the brief. Speed without direction produces volume, not value. We built the practice around the question, not the output.</p><p>The claypot is slower than a wok. That is the point.</p><p>The best AI work is slower than it looks. That is also the point.</p><p>I didn\'t plan to build a food company and an AI company in the same decade. But I\'m glad I did. They keep teaching me the same lesson from different angles.</p>'
    },
    '369620ab-c1bd-813f-991a-fb75a94358ba': {
      title: 'Bangkok and Hong Kong Are Not the Same City',
      tag: 'Operating', date: '5 December 2025',
      html: '<p>Hong Kong asks: where are the numbers?</p><p>Bangkok asks: where is the relationship?</p><p>Both are right. Both are fast. They are fast in different directions.</p><hr><h2>How they differ</h2><p>In Hong Kong, a meeting has an agenda. It starts on time. The first fifteen minutes are information exchange. Trust is built through proof — through a track record that can be checked, a deck that holds up to scrutiny, a structure that survives due diligence.</p><p>In Bangkok, a meeting has a context. The first fifteen minutes are reading the room. Trust is built through presence — through showing up consistently, through knowing the right people, through demonstrating that you are in this for the relationship, not just the transaction.</p><p>Neither is superior. Both have produced things I am proud of. Both have produced mistakes I learned from slowly.</p><hr><h2>The mistake I keep making</h2><p>I\'ve applied the wrong mode in the wrong city more times than I\'d like to admit.</p><p>In Hong Kong, I\'ve been too warm too early — led with relationship before establishing credibility, and watched the room go quiet. They were waiting for proof I hadn\'t provided yet.</p><p>In Bangkok, I\'ve been too clinical too fast — led with data before establishing trust, and watched the room go polite. They were waiting for connection I hadn\'t offered yet.</p><p>The room goes quiet in the same way both times. That is how you know.</p><hr><h2>The skill</h2><blockquote>The skill is not choosing between them. It is reading which one the day needs.</blockquote><p>This takes time. It still takes me a beat — a moment at the start of any meeting, in either city, to ask: <em>what mode is this?</em></p><p>But the question is now automatic. That is probably what twenty years of building in two cities is worth.</p><p>I spend roughly half my time in each city. Bangkok is home. Hong Kong is where a lot of the business happens. I am not sure I could do one without the other — each city has made me better at the other\'s game.</p>'
    }

  function renderStatic(id){
    var p = STATIC_POSTS[id];
    if(!p) return false;
    document.title = p.title + ' — Veerachit';
    document.getElementById('postContainer').innerHTML =
      '<div class="post-meta"><span>'+p.date+'</span><span class="p-tag-chip">'+p.tag+'</span></div>'
      +'<h1 class="post-title">'+p.title+'</h1>'
      +'<div class="post-content">'+p.html+'</div>';
    return true;
  }

  /* ---- fetch and render post --------------------------------- */
  var params = new URLSearchParams(window.location.search);
  var pageId  = params.get('id');
  var container = document.getElementById('postContainer');

  if(!pageId){
    container.innerHTML = '<p style="color:var(--text-faint);font-family:\'Space Mono\',monospace;font-size:.8rem">No post found. <a href="index.html#thoughts" style="color:var(--violet-light)">Back to thoughts →</a></p>';
  } else {
    /* Fetch page properties + blocks in parallel */
    Promise.all([
      fetch(NOTION_PROXY + '/notion/pages/' + pageId).then(function(r){ return r.json(); }),
      fetch(NOTION_PROXY + '/notion/blocks/' + pageId + '/children?page_size=100').then(function(r){ return r.json(); })
    ])
    .then(function(results){
      var page   = results[0];
      var blocks = results[1];

      if(page.object === 'error'){
        container.innerHTML = '<p style="color:var(--text-faint)">Post not found. <a href="index.html#thoughts" style="color:var(--violet-light)">Back to thoughts →</a></p>';
        return;
      }

      var props   = page.properties;
      var title   = (props.Title.title[0] && props.Title.title[0].plain_text) || 'Untitled';
      var tag     = (props.Tags && props.Tags.multi_select[0] && props.Tags.multi_select[0].name) || '';
      var date    = (props.Date && props.Date.date && props.Date.date.start)
                      ? new Date(props.Date.date.start).toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'})
                      : '';

      /* update page title for SEO */
      document.title = title + ' — Veerachit';

      container.innerHTML =
        '<div class="post-meta">'
          +(date ? '<span>'+date+'</span>' : '')
          +(tag  ? '<span class="p-tag-chip">'+tag+'</span>' : '')
        +'</div>'
        +'<h1 class="post-title">'+title+'</h1>'
        +'<div class="post-content">'
          +(blocks.results ? renderBlocks(blocks.results) : '')
        +'</div>';
    })
    .catch(function(){
      /* Worker not set up yet — fall back to static content */
      if(!renderStatic(pageId)){
        container.innerHTML = '<p style="color:var(--text-faint);font-family:\'Space Mono\',monospace;font-size:.8rem">Couldn\'t load post. <a href="index.html#thoughts" style="color:var(--violet-light)">Back to thoughts →</a></p>';
      }
    });
  }
})();
</script>
